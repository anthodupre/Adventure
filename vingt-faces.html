  }
  let gotLoot = false;
  for (const a of arr(o.items_add, 10)) {
    const got = addItem(a);
    if (got) { gotLoot = true; after.push({ t: 'loot', kind: 'objet', id: got.item.id, name: got.item.name, desc: got.item.desc, qty: got.qty }); fx.push('objet obtenu : ' + got.item.name + (got.qty > 1 ? ' x' + got.qty : '')); }
  }
  for (const a of arr(o.spells_add, 5)) {
    const sp = addSpell(a);
    if (sp) { gotLoot = true; after.push({ t: 'loot', kind: 'sort', id: sp.id, name: sp.name, desc: sp.desc, cost: sp.cost }); fx.push('pouvoir appris : ' + sp.name); }
  }
  for (const s of arr(o.statuses_remove, 6)) {
    const gone = removeStatus(s);
    if (gone) { chips.push({ k: 'lost', text: '− ' + gone }); fx.push('statut retiré : ' + gone); }
  }
  for (const s of arr(o.statuses_add, 6)) {
    if (addStatus(s)) { chips.push({ k: 'st', text: '◆ ' + cleanText(s, 40) }); fx.push('statut : ' + cleanText(s, 40)); }
  }
  for (const q of arr(o.quests, 6)) {
    const title = cleanText(q && q.title, 90); if (!title) continue;
    const status = q.status === 'terminee' ? 'done' : q.status === 'echouee' ? 'fail' : 'active';
    let ex = findIn(G.quests, title, 'title');
    if (!ex) { ex = { id: uid(), title, status, note: cleanText(q.note, 220), turn: G.turn }; G.quests.push(ex); if (status === 'active') after.push({ t: 'sys', ic: 'scroll', text: 'Nouvelle quête : ' + title }); }
    else {
      const was = ex.status; ex.status = status; if (q.note) ex.note = cleanText(q.note, 220);

    }
  }
  for (const a of arr(o.npcs, 8)) {
    const r = upsertNpc(a, false);
    if (!r) continue;
    if (r.isNew) after.push({ t: 'loot', kind: 'pnj', id: r.npc.id, name: r.npc.name, desc: r.npc.desc || r.npc.note });
    else if (r.changed.includes('dead')) chips.push({ k: 'lost', ic: 'skull', text: r.npc.name + ' n\'est plus' });
    else if (r.changed.includes('att')) chips.push({ k: 'rep', text: r.npc.name + ' : ' + ATT[r.npc.att].label.toLowerCase() });
  }
  for (const a of arr(o.factions, 5)) {
    const r = changeFaction(a);
    if (r && r.ch) { chips.push({ k: 'rep', ic: 'flag', text: r.f.name + ' ' + fmtMod(r.ch) }); fx.push('réputation ' + r.f.name + ' ' + fmtModA(r.ch)); }
  }
  // adversaires : la liste complète à jour (vide hors combat)
  const hadFoes = G.foes.length > 0;
  G.foes = arr(o.foes, 8).map(f => {
    const name = cleanText(f && f.name, 50);
    if (!name) return null;
    const npc = upsertNpc({ name, attitude: 'hostile', note: f.note }, true);
    const hpMax = clamp(int(f.hp_max, 10) || 10, 1, 9999);
    return { name, hp: clamp(int(f.hp), 0, hpMax), hpMax, note: cleanText(f.note, 80), npcId: npc ? npc.npc.id : '' };
  }).filter(Boolean);
  if (G.foes.length) fx.push('adversaires : ' + G.foes.map(f => f.name + ' ' + f.hp + '/' + f.hpMax).join(', '));
  if (hadFoes && !G.foes.length && H.hp > 0) unlock('vainqueur');

  const xp = clamp(int(o.xp_gain), 0, 500);
  if (xp) {
    H.xp += xp; chips.push({ k: 'xp', text: '+' + xp + ' XP' }); fx.push('XP +' + xp);
    while (H.xp >= xpNeed(H.level) && H.level < 20) {

      if (SKILL_LEVELS.includes(H.level)) H.skillPicks++;

      after.push({ t: 'sys', big: true, text: 'Niveau ' + H.level + ' ! PV et ' + T.mana + ' restaurés · +1 point de caractéristique' + (SKILL_LEVELS.includes(H.level) ? ' · +1 compétence' : '') + ' (onglet Héros)' });
      note('Le héros vient de passer au niveau ' + H.level + '.');
      Snd.level();

  }
  if (chips.length) pushLog({ t: 'fx', chips });
  after.forEach(e => pushLog(e));
  if (gotLoot) Snd.loot();

  G.choices = arr(o.choices, 5).map(c => cleanText(c, 90)).filter(Boolean);
  G.turn++;
  G.hist.push({ role: 'user', content: userContent(p) });
  G.hist.push({ role: 'assistant', content: narrative + (fx.length ? '\n[EFFETS] ' + fx.join(' ; ') : '') });
  if (S.autoVoice) speak(narrative);
  renderAll();

  if (!S.god && (H.hp <= 0 || o.ending === 'mort')) {
    let alive = false;
    if (o.ending !== 'mort' && !H.lastStandUsed) {
      const r = await Dice.ask({ title: 'Jet de la dernière chance', stat: 'CON', skill: '', dc: 10, reason: 'Tu vacilles au bord du néant. Un dernier sursaut ?', mana: 0, adv: 'normal', noCancel: true, plain: true });
      pushLog(Object.assign({ t: 'roll' }, r));
      if (r.ok) {
        alive = true; H.hp = 1; H.lastStandUsed = true; addStatus('À l\'agonie');
        pushLog({ t: 'sys', big: true, text: 'Tu t\'accroches à la vie : 1 PV. Il n\'y aura pas de seconde chance avant un vrai repos.' });
        note('Le héros est tombé à 0 PV mais a survécu de justesse (jet de la dernière chance réussi) : il lui reste 1 PV et il est à l\'agonie. Raconte ce sursaut. Il ne survivra pas une seconde fois avant un repos long.');
        unlock('increvable');
      }
    }
    if (!alive) {
      H.hp = 0; G.dead = true; G.choices = []; G.foes = [];
      pushLog({ t: 'sys', big: true, ic: 'skull', text: H.name + ' est mort. Ici s\'achève son histoire.' });
      recordFallen();
    }
  } else if (S.god && o.ending === 'mort') {
    pushLog({ t: 'sys', text: 'Mode dieu : la mort passe son chemin.' });
  }
  if (o.ending === 'fin' && !G.ended && !G.dead) { G.ended = true; pushLog({ t: 'sys', big: true, text: 'FIN. L\'histoire atteint sa conclusion, mais le monde reste ouvert.' }); }
  checkAch();

  if (G.hist.length >= 36) { try { await summarize(16); } catch (e) {} }
  autosave();
  renderAll();
  pumpArt();
  if (G.dead) showDeath(); else if (o.ending === 'fin') showEnding();
}
async function summarize(count) {
  const old = G.hist.slice(0, count);
  const transcript = old.map(m => (m.role === 'user' ? 'JOUEUR :\n' : 'RÉCIT :\n') + m.content).join('\n\n');
  showThinking(true, 'Le narrateur consigne la chronique…');
  try {
    const res = await callClaude({ system: SUMMARY_SYSTEM, maxTokens: 12000, tag: 'chronique',
      messages: [{ role: 'user', content: '[CHRONIQUE EXISTANTE]\n' + (G.summary || '(vide)') + '\n\n[TOURS À INTÉGRER]\n' + transcript }] });
    const s = cleanText(res.text, 3200);
    if (s.length > 40) { G.summary = s; G.hist.splice(0, count); }
  } finally { showThinking(false); }
}
function recordFallen() {

    words: last ? cleanText(plainText(last.text), 180) : '', sprite: H.sprite, quests: G.quests.filter(q => q.status === 'done').length });

function takeSnap() { try { prevSnap = JSON.stringify(G); store.set('vf_prev', G); } catch (e) {} }
async function act(text) {
  text = cleanText(text, 1200);

  if (!canNarrate()) { needNarrator(() => act(text)); return; }
  Snd.init();
  takeSnap();
  const p = { action: text, roll: null, setup: '', notes: G.notes, logMark: G.log.length };
  G.notes = [];
  G.choices = []; renderChoices();
  pushLog({ t: 'act', text });
  await runTurn(p);
}
async function runTurn(p) {
  pending = p; setBusy(true);
  let outcome = 'error';
  try { await yieldArtToStory(); outcome = await resolveTurn(p); }
  catch (e) {
    if (e && e.kind === 'cancelled' && !p.intro) { pending = p; dropPending(true); outcome = 'cancel-done'; }
    else showTurnError(e, p);
  }
  if (outcome === 'cancel') cancelTurn(p, true);
  if (outcome !== 'error') pending = null;
  setBusy(false);
  renderAll();
  pumpArt();
}
function cancelTurn(p, restoreInput) {
  pending = null;
  if (p.intro) return;
  G.notes = (p.notes || []).concat(G.notes);
  truncateLog(p.logMark);
  if (prevSnap) { try { const s = JSON.parse(prevSnap); G.choices = s.choices || []; } catch (e) {} }
  if (restoreInput) { const inp = $('#inp'); inp.value = p.action; autoGrow(); }
  renderAll();
}

  await runTurn({ intro: true, roll: null, setup: '', notes: [], logMark: 0 });
}
function undoTurn() {
  let snap = prevSnap;
  if (!snap) { const s = store.get('vf_prev'); if (s && G && s.id === G.id) snap = JSON.stringify(s); }
  if (!snap) { toast('Aucun tour à annuler.'); return false; }
  loadState(JSON.parse(snap), true);
  prevSnap = null;
  toast('Retour au tour précédent.');
  return true;
}
// Abandonne un tour resté en suspens (erreur ou arrêt).
function dropPending(restoreInput) {
  const p = pending; if (!p) return;
  pending = null;
  $$('#log-in > .e-err').forEach(x => x.remove());
  if (p.intro) return;

const Modal = {

    const key = e => { if (e.key === 'Escape' && !opt.noClose && wrap === $$('#modals .modal').pop()) close(); };
    const card = el('div', { class: 'm-card' + (opt.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
      opt.title || !opt.noClose ? el('div', { class: 'm-title' }, el('span', { text: opt.title || '' }), opt.noClose ? null : el('button', { class: 'm-x', text: '✕', 'aria-label': 'Fermer', onclick: close })) : null,

    wrap.append(card);

    document.addEventListener('keydown', key);

      el('label', { class: 'lab', for: 'c-desc', text: 'En quelques mots (facultatif)' }), bindInput(el('input', { class: 'field', id: 'c-desc', maxlength: 200, placeholder: 'ex. traque les esprits avec un appareil photo bricolé' }), 'cDesc'),
      el('label', { class: 'lab', text: 'Profil' }),
      el('div', { class: 'cards' }, Object.keys(PROFILES).map(k => el('button', { class: 'card' + (C.cProfile === k ? ' sel' : ''), onclick: () => { C.cProfile = k; renderCreate(); } },
        el('b', { text: PROFILES[k].name }), el('span', { text: PROFILES[k].desc }), el('span', { class: 'meta', text: 'PV ' + PROFILES[k].hp + ' · ' + T.mana + ' ' + PROFILES[k].mana + ' · ' + plural(PROFILES[k].spells, 'pouvoir') })))),
      el('label', { class: 'lab', text: 'Caractéristiques fortes · ' + C.cProf.length + ' / 2' }),
      el('div', { class: 'picks' }, STATS.map(s => el('button', { class: 'pick' + (C.cProf.includes(s) ? ' on' : ''), onclick: () => toggle(C.cProf, s, 2) }, STAT_NAMES[s]))),
      el('label', { class: 'lab', text: 'Compétences maîtrisées · ' + C.cSkills.length + ' / 4' }),
      el('div', { class: 'picks' }, SKILLS.map(s => el('button', { class: 'pick' + (C.cSkills.includes(s.id) ? ' on' : ''), title: s.hint, onclick: () => toggle(C.cSkills, s.id, 4) }, s.name, el('small', { text: s.stat }))))));
  }
  return out;
}
function createDetails() {
  const w = worldOf(C.world), T = cTerms();
  const role = C.role === 'custom' ? null : roleOf(C.role);
  const prof = role ? role.prof : C.cProf, skills = role ? role.skills : C.cSkills;
  const sum = STATS.reduce((s, k) => s + C.stats[k], 0), left = C.budget - sum;
  const archName = role ? (w.roles[ROLES.indexOf(role)] || role.gen) : (C.cName.trim() || 'Sur mesure');
  const st = STARTS.find(s => s.id === C.start);
  return [
    cSec('Caractéristiques', left > 0 ? plural(left, 'point') + ' à placer' : 'Tout est réparti. Les cadres dorés sont tes caractéristiques fortes.',
      el('div', { class: 'srows' }, STATS.map(s => el('div', { class: 'srow' + (prof.includes(s) ? ' prof' : '') },
        el('span', { class: 'ab', text: s }),
        el('div', { class: 'nm' }, el('b', { text: STAT_NAMES[s] }), el('small', { text: STAT_HINT[s] })),
        el('div', { class: 'ctl' },
          el('button', { class: 'stp', text: '−', 'aria-label': 'Baisser ' + STAT_NAMES[s], disabled: C.stats[s] <= 6, onclick: () => { C.stats[s]--; renderCreate(); } }),
          el('span', { class: 'val', text: C.stats[s] }),
          el('button', { class: 'stp', text: '+', 'aria-label': 'Monter ' + STAT_NAMES[s], disabled: C.stats[s] >= 18 || left <= 0, onclick: () => { C.stats[s]++; renderCreate(); } })),
        el('span', { class: 'md', text: fmtMod(mod(C.stats[s])) })))),
      el('div', { class: 'row wrap' },
        el('button', { class: 'btn sm', onclick: () => { STATS.forEach(s => { const r = [d6(), d6(), d6(), d6()].sort((x, y) => x - y); C.stats[s] = clamp(r[1] + r[2] + r[3], 6, 18); }); C.budget = STATS.reduce((t, k) => t + C.stats[k], 0); renderCreate(); } }, ic('d20', 18), 'Tirer au hasard (4d6)'),
        el('button', { class: 'btn sm ghost', text: 'Réinitialiser', onclick: () => { setRole(C.role); renderCreate(); } })),
      el('p', { class: 'hint', text: 'Le modificateur (à droite) s\'ajoute au d20. Une compétence maîtrisée ajoute encore +2.' })),
    cSec('Compétences maîtrisées', null, el('div', { class: 'picks' }, skills.map(id => el('span', { class: 'pick on' }, SKILL[id].name, el('small', { text: SKILL[id].stat }))))),
    cSec('Le ton de la partie', null,
      el('div', { class: 'cards' }, Object.keys(DIFFS).map(k => el('button', { class: 'card' + (C.diff === k ? ' sel' : ''), onclick: () => { C.diff = k; renderCreate(); } },
        el('b', { text: DIFFS[k].name }), el('span', { text: DIFFS[k].desc }))))),
    cSec('Langue du récit', null, el('select', { class: 'field', id: 'c-lang', onchange: e => { S.narrLang = e.target.value; saveSettings(); } },
      LANGS.map(l => el('option', { value: l, text: l, selected: S.narrLang === l })))),
    el('div', { class: 'summary' }, ic(role ? role.ic : 'quill', 64),
      el('div', { class: 'grow' }, el('b', { text: (C.name.trim() || 'Héros sans nom') + ', ' + archName }),
        el('p', { class: 'hint', text: (w.id === 'custom' ? (C.cwName.trim() || 'Monde sur mesure') : w.name) + ' · ' + st.name + ' · ' + DIFFS[C.diff].name + ' · ' + T.magic })))
  ];
}
function createNext() {
  if (C.step === 1) {
    if (C.world === 'custom' && C.cwPitch.trim().length < 12) { toast('Décris ton monde en quelques mots.'); return; }
    if (C.start === 'custom' && C.startText.trim().length < 8) { toast('Décris ta situation de départ.'); return; }
  }
  if (C.step === 2 && C.role === 'custom') {
    if (!C.cName.trim()) { toast('Donne un nom à ton archétype.'); return; }
    if (C.cProf.length !== 2) { toast('Choisis 2 caractéristiques fortes.'); return; }
    if (C.cSkills.length !== 4) { toast('Choisis 4 compétences.'); return; }
  }
  if (C.step < 3) { C.step++; renderCreate(true); return; }
  beginAdventure();
}
function createPrev() { if (C.step > 1) { C.step--; renderCreate(true); } else { show('title'); refreshTitle(); } }
function beginAdventure() {
  needNarrator(() => {
    Snd.init();
    G = newGameState(C); prevSnap = null; pending = null;
    Object.assign(UI, { tab: 'inv', sub: null, filter: 'all', q: '', wtab: 'quetes', npc: null, place: null });
    show('game'); setBusy(false); renderLog(); renderAll();
    queueSprite('portrait', 'hero', 0);
    startIntro();
  });
}

// ---------------------------------------------------------------- démarrage
function init() {
  applyLook();
  fillIcons(document);
  $('#t-new').addEventListener('click', openCreate);
  $('#t-continue').addEventListener('click', () => { const d = store.get('vf_auto'); if (d) loadState(d); });
  $('#t-load').addEventListener('click', () => openSlots('load'));
  $('#t-hall').addEventListener('click', openHall);
  $('#t-set').addEventListener('click', () => {
    const body = el('div'); const draw = () => { body.innerHTML = ''; body.append(...buildSettings(false, draw).flat(4).filter(Boolean)); refreshTitle(); };
    draw(); Modal.open({ title: '', wide: true, body });
  });
  $('#c-back').addEventListener('click', () => { show('title'); refreshTitle(); });
  $('#c-prev').addEventListener('click', createPrev);
  $('#c-next').addEventListener('click', createNext);
  $$('.hb[data-tab]').forEach(b => b.addEventListener('click', () => {
    const t = b.getAttribute('data-tab');
    if (!isWide() && $('#panel').classList.contains('open') && UI.tab === t) closePanel(); else openPanel(t);
  }));
  $('#b-save').addEventListener('click', quickSave);
  $('#b-menu').addEventListener('click', () => { if (!isWide() && $('#panel').classList.contains('open') && UI.tab === 'opts') closePanel(); else openPanel('opts'); });
  $('.p-scrim').addEventListener('click', closePanel);
  $('#hp-bar').addEventListener('click', () => openPanel('hero'));
  $('#mana-bar').addEventListener('click', () => openPanel('magic'));
  $('#act-btn').addEventListener('click', openActions);
  $('#send').addEventListener('click', sendInput);
  const inp = $('#inp');
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendInput(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$$('#modals .modal').length && !$('#dice').classList.contains('on') && $('#panel').classList.contains('open') && !isWide()) closePanel(); });
  window.addEventListener('resize', () => { if (G) { renderPanel(); updateHUD(); } });
  try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.skin === 'auto') applyLook(); }); } catch (e) {}
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  initVoice();
  refreshTitle();
}
// Dans Claude, la page peut être mise à jour pendant qu'on joue : on reprend alors la partie en cours.
function boot(data) {
  init();
  if (data && data.g) { try { loadState(JSON.parse(data.g)); } catch (e) {} }
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => (G && G.hist.length && !busy ? { g: JSON.stringify(G) } : {})); } catch (e) {}
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
