<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vingt Faces</title>
<style>
:root{
  --bg:#12100e; --bg2:#1b1815; --bg3:#26211c; --bg4:#322b24; --line:#3d352c;
  --ink:#ecdfc6; --dim:#a69882; --faint:#7b6f5f;
  --gold:#e3ad4c; --gold2:#b47f25;
  --hp:#d2544a; --mana:#4f97e6; --xp:#8fc46a;
  --ok:#7cc97f; --bad:#e36b5e; --crit:#f6cf5a; --near:#d9a05b;
  --mood:#e3ad4c;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:17px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body[data-mood="calme"]{--mood:#e3ad4c} body[data-mood="tension"]{--mood:#e08a3c}
body[data-mood="combat"]{--mood:#e0524a} body[data-mood="mystere"]{--mood:#9b7fe0}
body[data-mood="merveille"]{--mood:#54c7c0} body[data-mood="sombre"]{--mood:#7d8aa0}
body[data-mood="joie"]{--mood:#9fd05a}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
::selection{background:var(--gold2);color:#fff}
#app{position:fixed;inset:0;height:100vh;height:100dvh}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ---------- boutons & champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);font-weight:600;
  transition:transform .08s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:var(--gold);color:#1c1305}
.btn.danger{border-color:#7a3a33;color:#f0a79e}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:13.5px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.block{display:flex;width:100%}
.field{display:block;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--gold)}
textarea.field{resize:vertical;line-height:1.4}
label.lab{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.hint{font-size:13px;color:var(--dim);line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- écran titre ---------- */
#scr-title{align-items:center;justify-content:center;padding:calc(24px + var(--sat)) max(24px,var(--gr)) calc(24px + var(--sab)) max(24px,var(--gl));text-align:center;overflow:auto;
  background:radial-gradient(900px 500px at 50% 18%,#3a2a14 0%,transparent 60%),var(--bg)}
.t-die{width:150px;height:150px;margin-bottom:10px;filter:drop-shadow(0 10px 30px #000a);animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.t-name{font-family:var(--serif);font-size:clamp(40px,10vw,68px);letter-spacing:.08em;color:var(--gold);font-weight:700;line-height:1;text-shadow:0 2px 0 #000}
.t-sub{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:17px;margin:12px 0 28px;max-width:420px;line-height:1.45}
.t-menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.t-foot{margin-top:26px;font-size:12px;color:var(--faint);line-height:1.5}

/* ---------- création ---------- */
#scr-create{background:var(--bg)}
.c-head{padding:calc(12px + var(--sat)) var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.c-head h2{font-family:var(--serif);font-size:21px;color:var(--gold);flex:1}
.c-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px var(--gr) 28px var(--gl)}
.c-wrap{max-width:720px;margin:0 auto}
.c-sec{margin-bottom:26px}
.c-sec>h3{font-family:var(--serif);font-size:18px;margin-bottom:10px;color:var(--ink)}
.c-sec>h3 small{font-family:var(--sans);font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px;min-height:88px}
.card .ic{font-size:24px;line-height:1}
.card b{font-size:14.5px}
.card span{font-size:12.5px;color:var(--dim);line-height:1.35}
.card.sel{border-color:var(--gold);background:#2b2114;box-shadow:0 0 0 1px var(--gold) inset}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.statbox{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:10px;display:flex;align-items:center;gap:8px}
.statbox .nm{flex:1;min-width:0}
.statbox .nm b{display:block;font-size:14px}
.statbox .nm small{color:var(--dim);font-size:11.5px}
.statbox .val{font-family:var(--mono);font-size:18px;width:30px;text-align:center}
.statbox .md{font-family:var(--mono);font-size:12.5px;color:var(--gold);width:26px;text-align:center}
.statbox.prof{border-color:var(--gold2)}
.stp{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);font-size:18px;line-height:1}
.stp:disabled{opacity:.3}
.c-foot{padding:12px var(--gr) calc(12px + var(--sab)) var(--gl);border-top:1px solid var(--line);background:var(--bg2)}
.c-foot .btn{max-width:720px;margin:0 auto}

/* ---------- jeu ---------- */
#scr-game{background:
  radial-gradient(1100px 380px at 50% -80px,color-mix(in srgb,var(--mood) 16%,transparent),transparent 70%),var(--bg);
  transition:background .8s}
#hud{padding:calc(8px + var(--sat)) var(--gr) 8px var(--gl);background:#161310ee;border-bottom:1px solid var(--line);position:relative;z-index:3;display:flex;flex-direction:column;gap:8px}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--mood),transparent);opacity:.7}
.hud-top{display:flex;align-items:center;gap:10px;order:1}
.hud-loc{flex:1;min-width:0;display:flex;flex-direction:column}
.hud-loc b{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-loc small{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-btns{display:flex;gap:6px;order:3}
.hb{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);font-size:17px;position:relative}
.hb.on{border-color:var(--gold);background:#2b2114}
.hb .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#1c1305;font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
.hud-bars{display:flex;gap:8px;align-items:center;order:2}
.bar{flex:1;height:20px;cursor:pointer;border-radius:10px;background:#0b0908;border:1px solid var(--line);position:relative;overflow:hidden;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:10px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:linear-gradient(180deg,#e7675c,#a8372f)}
.bar.mana i{background:linear-gradient(180deg,#6fb0f2,#2f6fc0)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;font-family:var(--mono)}
.pill{height:20px;display:flex;align-items:center;gap:4px;font-size:12px;font-family:var(--mono);white-space:nowrap;color:var(--ink)}
.pill.lvl{flex-direction:column;align-items:stretch;gap:2px;height:auto;min-width:46px;text-align:center}
.pill.lvl .xp{display:block;height:3px;border-radius:2px;background:#0b0908;overflow:hidden}
.pill.lvl .xp i{display:block;height:100%;width:0;background:var(--xp);transition:width .5s}
.god-badge{font-size:10px;font-weight:800;letter-spacing:.1em;color:#1c1305;background:var(--crit);border-radius:6px;padding:2px 6px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.flash-heal{animation:flashh .6s}
@keyframes flashh{0%{box-shadow:0 0 0 0 #7cc97f00}40%{box-shadow:0 0 0 4px #7cc97faa}100%{box-shadow:0 0 0 0 #7cc97f00}}

#game-body{flex:1;min-height:0;display:flex}
#game-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px var(--gr) 10px var(--gl);scroll-behavior:smooth}
#log-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.e-narr{font-family:var(--serif);font-size:var(--fs);line-height:1.64;color:var(--ink);animation:fadeup .35s}
.e-narr p{margin:0 0 .7em} .e-narr p:last-child{margin-bottom:0}
.e-narr b{color:#fff2d3} .e-narr i{color:#d9cbb0}
.e-narr.setup{color:var(--dim);font-style:italic}
.e-narr.live::after{content:"▍";color:var(--mood);animation:blink 1s steps(2) infinite;margin-left:2px}
.e-narr.first p:first-child::first-letter{font-size:2.6em;float:left;line-height:.85;padding:.08em .1em 0 0;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.e-act{display:flex;justify-content:flex-end;animation:fadeup .25s}
.e-act span{max-width:86%;padding:9px 13px;border-radius:14px 14px 4px 14px;background:#2b2114;border:1px solid #5a431d;color:#f4e2bb;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.e-roll{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);animation:fadeup .3s;border-left:4px solid var(--dim)}
.e-roll .rd{width:42px;height:42px;flex:none}
.e-think .die .n{display:none}
.e-roll .rt{flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:var(--dim)}
.e-roll .rt b{color:var(--ink)}
.e-roll .rv{font-weight:800;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.v-crit{border-left-color:var(--crit)} .v-crit .rv{color:var(--crit)}
.v-success{border-left-color:var(--ok)} .v-success .rv{color:var(--ok)}
.v-near{border-left-color:var(--near)} .v-near .rv{color:var(--near)}
.v-fail{border-left-color:var(--bad)} .v-fail .rv{color:var(--bad)}
.v-fumble{border-left-color:#b02a20} .v-fumble .rv{color:#ff7b6d}
.e-fx{display:flex;flex-wrap:wrap;gap:6px;animation:fadeup .3s}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.dmg{color:#ff9d92;border-color:#6d2f29} .chip.heal{color:#a6e3a8;border-color:#2f5f33}
.chip.mana{color:#a9cff7;border-color:#2b4d77} .chip.gold{color:#f2cf86;border-color:#6b5223}
.chip.xp{color:#c2e6a6;border-color:#40602c} .chip.lost{color:var(--dim)} .chip.st{color:#d9c2f5;border-color:#4b3b6b}
.chip.loc{color:var(--ink)}
.e-loot{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;margin-top:-6px;border-radius:12px;background:linear-gradient(90deg,#2b2114,transparent);border:1px solid #4a3a1d;animation:fadeup .35s}
.e-loot .lt{flex:1;min-width:0}
.e-loot .lt small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-right:8px}
.e-loot .lt b{font-size:14.5px}
.e-loot .lt span{display:block;font-size:12.5px;color:var(--dim);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-sys{text-align:center;font-size:12.5px;color:var(--dim);letter-spacing:.04em;padding:2px 10px;animation:fadeup .3s}
.e-sys.big{color:var(--gold);font-size:14px;font-weight:700}
.e-err{padding:12px;border-radius:12px;border:1px solid #7a3a33;background:#2a1513;color:#f3c3bc;font-size:14px;line-height:1.45}
.e-err .row{margin-top:10px}
.e-think{display:flex;align-items:center;gap:10px;color:var(--dim);font-style:italic;font-family:var(--serif);font-size:15px}
.e-think svg{width:26px;height:26px;animation:spin 2.2s linear infinite;flex:none}
.e-think span{flex:1}
.e-think button{font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:30px}
@keyframes spin{to{transform:rotate(360deg)}}

#dock{padding:8px var(--gr) calc(10px + var(--sab)) var(--gl);border-top:1px solid var(--line);background:#161310f2}
#dock-in{max-width:720px;margin:0 auto}
#choices{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#choices::-webkit-scrollbar{display:none}
#choices:empty{display:none}
.choice{flex:none;max-width:78vw;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-size:13.5px;line-height:1.3;text-align:left;color:var(--ink)}
.choice:hover{border-color:var(--mood)}
.inrow{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;min-height:44px;max-height:132px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1.35;resize:none;outline:none;font-family:var(--sans)}
#inp:focus{border-color:var(--mood)}
#send{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1c1305;font-size:20px;font-weight:800;flex:none}
#dock.busy #send,#dock.busy .choice{opacity:.4;pointer-events:none}

/* ---------- panneau (onglets) ---------- */
#panel{position:fixed;inset:0;z-index:20;display:none}
#panel.open{display:block}
.p-scrim{position:absolute;inset:0;background:#000a;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.p-card{position:absolute;left:0;right:0;bottom:0;max-height:90%;height:90%;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:slideup .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.p-tabs{display:flex;gap:2px;padding:8px max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);align-items:flex-end}
.p-tab{flex:1;padding:8px 2px 9px;border-radius:10px 10px 0 0;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;border-bottom:0;white-space:nowrap}
.p-tab .ic{font-size:19px}
.p-tab.on{background:var(--bg);border-color:var(--line);color:var(--gold)}
.p-close{width:38px;height:38px;font-size:18px;color:var(--dim);margin-bottom:4px;flex:none}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px var(--gr) calc(18px + var(--sab)) var(--gl);background:var(--bg)}
.p-h{font-family:var(--serif);font-size:18px;color:var(--gold);margin:0 0 4px}
.p-sub{font-size:12.5px;color:var(--dim);margin-bottom:12px;line-height:1.4}
.sec-t{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.empty{color:var(--faint);font-style:italic;font-family:var(--serif);padding:14px 4px;text-align:center}

.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:98px}
.tile:hover{border-color:var(--faint)}
.tile.eq{border-color:var(--gold);background:#2b2114}
.tile .nm{font-size:11px;line-height:1.2;text-align:center;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tile .q{position:absolute;top:4px;right:5px;font-family:var(--mono);font-size:11px;font-weight:700;color:#1c1305;background:var(--gold);border-radius:6px;padding:0 5px;line-height:16px}
.tile .e{position:absolute;top:4px;left:5px;font-size:10px;font-weight:800;color:var(--gold)}
.spr{display:block;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.spr.pending{border-radius:8px;background:linear-gradient(100deg,#2a241e 30%,#3a3128 50%,#2a241e 70%);background-size:220% 100%;animation:shim 1.1s linear infinite;position:relative}
.spr.pending::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:16px;animation:blink 1.2s steps(2) infinite}
@keyframes shim{to{background-position:-220% 0}}
.det-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.det-top .frame{padding:8px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.det-top h3{font-family:var(--serif);font-size:20px;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.g{color:var(--gold);border-color:var(--gold2)}
.det-desc{font-family:var(--serif);font-size:16px;line-height:1.55;color:#dccfb5;margin-bottom:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{font-size:13.5px;color:var(--dim);margin-bottom:10px;display:inline-flex;gap:6px;align-items:center;min-height:32px}

.hero-top{display:flex;gap:14px;align-items:center}
.hero-top h3{font-family:var(--serif);font-size:22px}
.hero-top p{font-size:13px;color:var(--dim);line-height:1.4;margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbox{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:8px 6px;text-align:center;position:relative}
.sbox.prof{border-color:var(--gold2)}
.sbox small{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--dim)}
.sbox b{display:block;font-family:var(--mono);font-size:20px;margin:2px 0}
.sbox i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold)}
.sbox .plus{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1c1305;font-weight:800;font-size:16px;line-height:26px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2a251f;font-size:14px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{text-align:right}
.li{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:8px;text-align:left;width:100%}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:14.5px}

    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;

  const s = esc(t).replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+?)\*/g, '<i>$1</i>');
  return s.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}
function d20() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 20 + 1; }
  catch (e) { return Math.floor(Math.random() * 20) + 1; }
}
function d6() { return Math.floor(Math.random() * 6) + 1; }
function fmtDate(ts) {
  try { return new Date(ts).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

// ---------------------------------------------------------------- stockage
const store = {
  mem: {}, ok: true,
  get(k) {
    let v = null;
    try { v = localStorage.getItem(k); } catch (e) { this.ok = false; }
    if (v == null) v = this.mem[k] || null;
    if (v == null) return null;
    try { return JSON.parse(v); } catch (e) { return null; }
  },
  set(k, val) {
    const s = JSON.stringify(val);
    this.mem[k] = s;
    try { localStorage.setItem(k, s); return true; } catch (e) { this.ok = false; return false; }
  },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

// ---------------------------------------------------------------- sons (WebAudio, aucun fichier)
const Snd = {
  ctx: null,
  init() {
    if (!S.sound) return;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e) {}
  },
  tone(f, dur, type, vol, delay) {
    if (!S.sound || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  dice() { for (let i = 0; i < 10; i++) this.tone(170 + Math.random() * 260, 0.045, 'square', 0.045, i * 0.085 + Math.random() * 0.02); },
  good() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.17, 'triangle', 0.09, i * 0.09)); },
  crit() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.1, i * 0.08)); },
  bad() { [220, 175].forEach((f, i) => this.tone(f, 0.26, 'sawtooth', 0.055, i * 0.14)); },
  fumble() { [196, 156, 117, 87].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.065, i * 0.13)); },
  loot() { [880, 1175].forEach((f, i) => this.tone(f, 0.13, 'sine', 0.07, i * 0.07)); },
  level() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.09, i * 0.1)); },
  tap() { this.tone(660, 0.05, 'sine', 0.04); }
};

// ---------------------------------------------------------------- API Claude
class ApiError extends Error {
  constructor(msg, kind, status) { super(msg); this.kind = kind; this.status = status; }
}
const DEV = { lastReq: null, lastRes: null, total: { in: 0, out: 0, cr: 0, cw: 0, calls: 0 } };

// Deux façons de joindre le narrateur :
//  - publiée comme artifact dans Claude, la page passe par claude.use("sample") : le compte Claude du joueur, sans clé ;
//  - ouverte ailleurs (Koder, navigateur), elle appelle l'API Anthropic avec la clé du joueur.
let SAMPLE = null;
const sampleReady = HAS_HOST
  ? Promise.resolve().then(() => window.claude.use('sample')).then(fn => { SAMPLE = typeof fn === 'function' ? fn : null; onNarratorReady(); return SAMPLE; }, () => null)
  : Promise.resolve(null);
const canNarrate = () => !!(SAMPLE || S.apiKey);
function onNarratorReady() { try { refreshTitle(); if (G) { requeueSprites(); renderPanel(); } } catch (e) {} }
// Vérifie qu'un narrateur est joignable, sinon explique quoi faire. Appelle `after` dès que c'est bon.
async function needNarrator(after) {
  if (HAS_HOST && !SAMPLE) await sampleReady;
  if (canNarrate()) { if (after) after(); return; }
  if (HAS_HOST) {
    Modal.open({ title: 'Claude est injoignable ici', body: el('p', { class: 'm-text', text: 'Cette page ne peut pas joindre Claude dans cette vue. Ouvre-la depuis l\'application Claude, en étant connecté à ton compte.' }), actions: [{ label: 'Compris', cls: 'primary' }] });
    return;
  }
  openKeyModal(after);
}
function parseLooseJSON(text) {
  let data = null;
  try { data = JSON.parse(text); }
  catch (e) {
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    if (a >= 0 && b > a) { try { data = JSON.parse(text.slice(a, b + 1)); } catch (e2) {} }
  }
  return data && typeof data === 'object' && !Array.isArray(data) ? data : null;
}
// Décrit un schéma JSON en clair, pour le narrateur intégré (qui n'a pas de sortie contrainte).
function schemaHint(sc) {
  if (sc.anyOf) return sc.anyOf.map(schemaHint).join(' ou ');
  if (sc.type === 'null') return 'null';
  if (sc.type === 'object') return '{' + Object.keys(sc.properties).map(k => JSON.stringify(k) + ': ' + schemaHint(sc.properties[k])).join(', ') + '}';
  if (sc.type === 'array') return '[' + schemaHint(sc.items) + ', …]';
  if (sc.enum) return JSON.stringify(sc.enum.join('|'));
  if (sc.type === 'integer') return '0';
  if (sc.type === 'boolean') return 'true|false';
  return '"…"';
}
function sampleInput(opt) {
  const txt = m => typeof m.content === 'string' ? m.content : m.content.map(b => b.text).join('\n');
  const msgs = opt.messages, last = msgs[msgs.length - 1], past = msgs.slice(0, -1);
  let s = opt.system;
  if (opt.schema) s += '\n\n# Format de réponse\nTa réponse est lue par un programme : réponds uniquement par un objet JSON valide, sans texte autour et sans bloc de code. Il contient exactement ces champs, dans cet ordre (une barre verticale sépare les valeurs permises, 0 désigne un nombre entier) :\n' + schemaHint(opt.schema);
  if (past.length) s += '\n\n# La partie jusqu\'ici (du plus ancien au plus récent)\n' + past.map(m => (m.role === 'user' ? '— JOUEUR —\n' : '— RÉCIT DÉJÀ RACONTÉ —\n') + txt(m)).join('\n\n');
  s += '\n\n# ' + (past.length ? 'Message actuel' : 'Demande') + '\n' + txt(last);
  if (opt.schema) s += '\n\nRéponds maintenant par l\'objet JSON seul.';
  return s;
}
function mapSampleError(e) {
  const code = (e && e.code) || 'upstream_error';
  const M = {
    cancelled: ['Action annulée.', 'cancelled'],
    not_granted: ['Cette page n\'a pas reçu l\'autorisation d\'utiliser Claude. Recharge la page et accepte la demande pour jouer.', 'denied'],
    sampling_disabled: ['Claude n\'est pas disponible pour ce compte dans cette page.', 'denied'],
    not_declared: ['Cette page n\'est plus reliée à Claude.', 'denied'],
    capability_disabled: ['Claude est indisponible dans cette vue.', 'denied'],
    capability_removed: ['Claude est indisponible dans cette vue. Mets à jour ton application.', 'denied'],
    rate_limited: ['Limite d\'utilisation de Claude atteinte pour le moment. Patiente un peu avant de réessayer.', 'rate'],
    session_expired: ['Ta session Claude a expiré. Reconnecte-toi, puis réessaie.', 'auth-host'],
    refused: ['Le narrateur a décliné cette demande.', 'refusal'],
    prompt_too_large: ['L\'histoire est devenue trop longue pour le narrateur. Réessaie : la chronique va la condenser.', 'bad'],
    empty_completion: ['Le narrateur est resté muet. Réessaie, ou reformule ton action.', 'server'],
    invalid_request: ['Requête refusée : ' + ((e && e.message) || ''), 'bad']
  };
  const m = M[code] || ['Le lien avec le narrateur a été interrompu. Réessaie.', 'server'];
  return new ApiError(m[0], m[1]);
}
async function callSample(opt) {
  const input = sampleInput(opt);
  const options = { model: MODEL, modelTier: 'default', effort: EFFORT, cache: false };
  if (opt.signal) options.signal = opt.signal;
  if (opt.onText) options.onText = u => { try { opt.onText(u.text); } catch (e) {} };
  DEV.lastReq = { tag: opt.tag, at: Date.now(), via: 'claude.use("sample")', model: MODEL, effort: EFFORT, input };
  let res;
  try { res = await SAMPLE(input, options); }
  catch (e) { DEV.lastRes = { tag: opt.tag, error: e && e.code, message: e && e.message }; throw mapSampleError(e); }
  for (const t of [DEV.total, G && G.usage]) if (t) t.calls = (t.calls || 0) + 1;
  const text = String((res && res.text) || '');
  DEV.lastRes = { tag: opt.tag, modelApplied: (res && res.modelApplied) || '(palier ' + (res && res.modelTierApplied) + ')', truncated: !!(res && res.truncated), text };
  if (!opt.schema) return { text, usage: {} };
  const data = parseLooseJSON(text);
  if (!data) throw new ApiError(res && res.truncated ? 'La réponse du narrateur a été tronquée.' : 'Réponse illisible du narrateur.', 'server');
  return { data, text, usage: {} };
}

// Extrait, pendant le streaming, la valeur (partielle) d'un champ texte de premier niveau d'un JSON incomplet.
function partialField(buf, key) {
  let i = 0, depth = 0, inStr = false, strStart = 0, lastStr = null, pendingKey = null;
  const n = buf.length;
  while (i < n) {
    const c = buf[i];
    if (inStr) {
      if (c === '\\') { i += 2; continue; }
      if (c === '"') { inStr = false; lastStr = buf.slice(strStart, i); }
      i++; continue;
    }
    if (c === '"') {
      if (depth === 1 && pendingKey === key) return decodePartialString(buf, i + 1);
      inStr = true; strStart = i + 1;
    } else if (c === '{' || c === '[') { depth++; if (depth > 1) pendingKey = null; }
    else if (c === '}' || c === ']') depth--;
    else if (c === ':') { if (depth === 1 && lastStr != null) pendingKey = lastStr; }
    else if (c === ',') { if (depth === 1) pendingKey = null; }
    i++;
  }
  return null;
}
function decodePartialString(buf, start) {
  let i = start; const n = buf.length;
  while (i < n) { if (buf[i] === '\\') { i += 2; continue; } if (buf[i] === '"') break; i++; }
  let raw = buf.slice(start, Math.min(i, n));
  raw = raw.replace(/\\u[0-9a-fA-F]{0,3}$/, '').replace(/(^|[^\\])((?:\\\\)*)\\$/, '$1$2');
  try { return JSON.parse('"' + raw + '"'); }
  catch (e) { return raw.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\'); }
}

function makeAccumulator(onText) {
  return {
    blocks: [], stop: null, usage: { in: 0, out: 0, cr: 0, cw: 0 }, model: null,
    text() { return this.blocks.filter(b => b && b.type === 'text').map(b => b.text).join(''); },
    handle(ev) {
      if (!ev || !ev.type) return;
      if (ev.type === 'message_start' && ev.message) {
        this.model = ev.message.model;
        const u = ev.message.usage || {};
        this.usage.in = u.input_tokens || 0; this.usage.cr = u.cache_read_input_tokens || 0; this.usage.cw = u.cache_creation_input_tokens || 0;
      } else if (ev.type === 'content_block_start') {
        const cb = ev.content_block || {};
        this.blocks[ev.index] = { type: cb.type, text: cb.text || '' };
      } else if (ev.type === 'content_block_delta') {
        const b = this.blocks[ev.index];
        if (b && ev.delta && ev.delta.type === 'text_delta') { b.text += ev.delta.text || ''; if (onText) onText(this.text()); }
      } else if (ev.type === 'message_delta') {
        if (ev.delta && ev.delta.stop_reason) this.stop = ev.delta.stop_reason;
        if (ev.usage && ev.usage.output_tokens != null) this.usage.out = ev.usage.output_tokens;
      } else if (ev.type === 'error') {
        const er = ev.error || {};
        throw mapApiError(er.type === 'overloaded_error' ? 529 : 500, er);
      }
    }
  };
}
function feedSSE(acc, state, chunk) {
  state.buf += chunk;
  let m;
  while ((m = state.buf.match(/\r?\n\r?\n/))) {
    const block = state.buf.slice(0, m.index);
    state.buf = state.buf.slice(m.index + m[0].length);
    const data = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
    if (!data || data === '[DONE]') continue;
    let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
    acc.handle(ev);
  }
}
function mapApiError(status, er) {
  const type = (er && er.type) || '', msg = (er && er.message) || '';
  if (status === 401) return new ApiError('Clé API refusée. Vérifie ta clé Anthropic dans les réglages.', 'auth', status);
  if (status === 403) return new ApiError('Cette clé API n\'a pas la permission d\'utiliser ce modèle. ' + msg, 'auth', status);
  if (status === 429) return new ApiError('Limite de requêtes atteinte. Patiente quelques secondes.', 'rate', status);
  if (status === 529 || type === 'overloaded_error') return new ApiError('Les serveurs de Claude sont surchargés. Réessaie dans un instant.', 'overloaded', status);
  if (status >= 500) return new ApiError('Erreur du serveur Claude (' + status + ').', 'server', status);
  if (status === 400 && /fallback|anthropic-beta|beta/i.test(msg)) return new ApiError(msg, 'fallback-unsupported', status);
  if (/credit balance|billing/i.test(msg)) return new ApiError('Ton compte API n\'a plus de crédit. Recharge-le sur platform.claude.com, puis réessaie.', 'billing', status);
  return new ApiError('Requête refusée par l\'API (' + status + ') : ' + (msg || type || 'erreur inconnue'), 'bad', status);
}

async function callOnce(opt) {
  const body = {
    model: MODEL,
    max_tokens: opt.maxTokens || 6000,
    stream: true,
    output_config: { effort: EFFORT },
    // Le prompt système est stable pendant toute la partie : on le met en cache.
    system: [{ type: 'text', text: opt.system, cache_control: { type: 'ephemeral' } }],
    messages: opt.messages
  };
  if (opt.schema) body.output_config.format = { type: 'json_schema', schema: opt.schema };
  const headers = {
    'content-type': 'application/json',
    'x-api-key': S.apiKey,
    'anthropic-version': API_VERSION,
    'anthropic-dangerous-direct-browser-access': 'true'
  };
  // Repli automatique côté serveur si un filtre de sécurité décline la requête.
  if (S.useFallbacks) { body.fallbacks = 'default'; headers['anthropic-beta'] = FALLBACK_BETA; }
  DEV.lastReq = { tag: opt.tag, at: Date.now(), body };

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 150000);
  const stopped = () => !!(opt.signal && opt.signal.aborted);
  if (opt.signal) { if (opt.signal.aborted) ctl.abort(); else opt.signal.addEventListener('abort', () => ctl.abort(), { once: true }); }
  try {
    let resp;
    try { resp = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal }); }
    catch (e) {
      if (stopped()) throw new ApiError('Action annulée.', 'cancelled');
      throw new ApiError(ctl.signal.aborted ? 'Le narrateur met trop de temps à répondre.' : 'Impossible de joindre l\'API Claude. Vérifie ta connexion Internet.', 'network');
    }
    if (!resp.ok) {
      let er = null;
      try { const j = await resp.json(); er = j && j.error; } catch (e) {}
      throw mapApiError(resp.status, er);
    }
    const acc = makeAccumulator(opt.onText), st = { buf: '' };
    try {
      if (resp.body && typeof resp.body.getReader === 'function' && typeof TextDecoder !== 'undefined') {
        const reader = resp.body.getReader(), dec = new TextDecoder();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          feedSSE(acc, st, dec.decode(value, { stream: true }));
        }
        feedSSE(acc, st, '\n\n');
      } else {
        feedSSE(acc, st, (await resp.text()) + '\n\n');
      }
    } catch (e) {
      if (e instanceof ApiError) throw e;
      if (stopped()) throw new ApiError('Action annulée.', 'cancelled');
      throw new ApiError(ctl.signal.aborted ? 'Le narrateur met trop de temps à répondre.' : 'La connexion a été coupée pendant la réponse.', 'network');
    }
    const u = acc.usage;
    for (const t of [DEV.total, G && G.usage]) if (t) { t.in += u.in; t.out += u.out; t.cr += u.cr; t.cw += u.cw; t.calls = (t.calls || 0) + 1; }
    const text = acc.text();
    DEV.lastRes = { tag: opt.tag, stop: acc.stop, model: acc.model, usage: u, text };
    if (acc.stop === 'refusal') throw new ApiError('Le narrateur a décliné cette demande.', 'refusal');
    if (!opt.schema) return { text, usage: u };
    const data = parseLooseJSON(text);
    if (!data) {
      throw new ApiError(acc.stop === 'max_tokens' ? 'La réponse du narrateur a été tronquée.' : 'Réponse illisible du narrateur.', 'server');
    }
    return { data, text, usage: u };
  } finally { clearTimeout(timer); }
}

async function callClaude(opt) {
  if (HAS_HOST && !SAMPLE) await sampleReady;
  // Narrateur intégré : une seule tentative, c'est le joueur qui relance.
  if (SAMPLE) return callSample(opt);
  if (!S.apiKey) throw new ApiError('Aucune clé API enregistrée.', 'nokey');
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { return await callOnce(opt); }
    catch (e) {
      last = e;
      if (e.kind === 'fallback-unsupported' && S.useFallbacks) { S.useFallbacks = false; saveSettings(); attempt--; continue; }
      const retry = e.kind === 'network' || e.kind === 'overloaded' || e.kind === 'rate' || e.kind === 'server';
      if (!retry || attempt === 2) throw e;
      await sleep(1300 * (attempt + 1) * (attempt + 1));
    }
  }
  throw last;
}

// ---------------------------------------------------------------- prompts
function sysPrompt() {
  const H = G.hero;
  return `Tu es le Maître du Jeu de « Vingt Faces », un jeu de rôle textuel en solo inspiré de Donjons & Dragons, où tout est possible. Le joueur écrit librement ce que son personnage tente ; tu arbitres avec équité, puis tu racontes. Un programme tient les comptes (points de vie, mana, or, inventaire) et lance les dés : toi, tu décides de ce qui se passe dans la fiction et tu le signales au programme par les champs de ta réponse JSON.

# Le monde
${G.world.name}. ${G.world.pitch}

# Le héros
${H.name}, ${H.archName}.${H.concept ? ' Concept : ' + H.concept : ''}
Caractéristiques maîtrisées : ${H.prof.map(s => STAT_NAMES[s]).join(' et ')}.

# Langue
Tout ce que lit le joueur (narrative, reason, choices, noms et descriptions d'objets et de sorts, statuts, quêtes, lieux) est écrit en : ${G.lang}. Les valeurs d'énumération du schéma restent telles quelles.

# Déroulement d'un tour
Chaque message du joueur contient :
- [ÉTAT] : la vérité chiffrée du jeu, à jour. Fie-toi à elle plutôt qu'à ta mémoire pour l'inventaire, les PV, le mana, l'or et les sorts connus.
- [ACTION] : ce que le joueur tente, en texte libre.
- parfois [JET] : le résultat d'un dé que le programme vient de lancer pour cette action.
- parfois [NOTES] : des événements survenus hors récit (équipement changé, niveau gagné…) à intégrer naturellement.

Tu réponds de l'une de ces deux façons :
1. Demander un jet (needs_roll = true) quand l'issue est incertaine et que réussir ou échouer change vraiment la suite : combat, acrobatie, discrétion, persuasion risquée, magie, effort physique, ramasser quelque chose de lourd, fixé, gardé ou dangereux… Remplis « roll », écris dans « narrative » une ou deux phrases de mise en tension qui s'arrêtent juste avant l'issue, et laisse tout le reste neutre (0, listes vides, rest « aucun », ending « aucune », location et time_of_day inchangés).
2. Raconter directement (needs_roll = false, roll = null) quand l'action est banale, sans risque, ou relève de la simple conversation ou de l'observation.

Quand [JET] est présent, le dé est déjà lancé : needs_roll = false, roll = null, et tu racontes l'issue en respectant strictement le verdict.
- RÉUSSITE CRITIQUE : succès éclatant, avec un bonus inattendu.
- RÉUSSITE : l'action réussit comme voulu.
- ÉCHEC DE PEU : c'est raté, mais avec un petit quelque chose (progrès partiel, ou réussite avec un coût).
- ÉCHEC : l'action rate et la situation se complique.
- ÉCHEC CRITIQUE : désastre mémorable, parfois drôle, toujours avec des conséquences.
Un seul jet par action : ne demande jamais un second jet pour la même action, et n'invente jamais toi-même un résultat de dé.

# Tout est possible
Ne dis jamais qu'une action est impossible ou interdite par le jeu. Si le joueur tente quelque chose d'absurde, de génial ou de suicidaire, fixe une difficulté honnête et laisse le dé et les conséquences parler. Il peut aller n'importe où, parler à n'importe qui, ramasser n'importe quoi, changer de but en cours de route : invente lieux, personnages et objets au besoin, en restant cohérent avec ce qui est déjà établi. Le monde réagit, se souvient, et ses conséquences persistent. Les « choices » ne sont que des suggestions, jamais des rails.

# Régler un jet
stat : la caractéristique qui correspond à la façon dont le joueur s'y prend (FOR ${STAT_HINT.FOR} · DEX ${STAT_HINT.DEX} · CON ${STAT_HINT.CON} · INT ${STAT_HINT.INT} · SAG ${STAT_HINT.SAG} · CHA ${STAT_HINT.CHA}).
dc : 5 très facile · 8 facile · 11 moyen · 14 corsé · 17 difficile · 20 très difficile · 24 héroïque · 28 légendaire · 32 quasi impossible. Le programme ajoute lui-même au d20 le modificateur de caractéristique, la maîtrise et les bonus d'équipement, puis ajuste selon le mode de difficulté : n'en tiens pas compte dans dc. Un 20 naturel réussit toujours, un 1 naturel échoue toujours.
advantage : « avantage » si l'approche est maligne, bien préparée ou servie par le bon outil ; « desavantage » si les circonstances sont franchement contraires ; sinon « normal ».
reason : une courte phrase qui dit au joueur ce qui est en jeu.

# Magie
La magie existe pour tous, mais elle coûte et elle a des limites.
- mana_cost (dans roll) : tour de passe-passe 1 · sort mineur 2-3 · modéré 4-6 · puissant 7-10 · majeur 12 et plus. Le programme prélève ce mana au moment du jet, que le sort réussisse ou non. Indique toujours le vrai coût, même s'il dépasse le mana du héros : le programme lui proposera alors de payer la différence en points de vie (surcharge).
- Un sort connu (liste « sorts_connus » de [ÉTAT]) coûte son prix indiqué et se lance à difficulté normale. Une magie improvisée coûte 2 de plus et se lance avec un dc augmenté de 3.
- La puissance accessible suit le niveau du héros : au niveau 1, pas de résurrection, de téléportation lointaine ni de boule de feu dévastatrice sans un dc de 24 ou plus et un coût majeur.
- Presque toute vraie magie demande un jet. Un échec critique déclenche un contrecoup de magie sauvage.
- Le mana ne revient pas tout seul : seulement par le repos, des potions ou des lieux de pouvoir. N'utilise mana_change que pour ces gains, ou pour un coût qui n'est pas passé par un jet.
- Le héros apprend un sort (spells_add) quand la fiction le justifie : grimoire étudié, maître, révélation, ou magie improvisée réussie de façon critique.

# Inventaire
Tout ce que le héros ramasse, achète, reçoit, vole ou fabrique entre dans items_add — une épée comme un caillou, une chaise, une dent de monstre ou une odeur mise en bocal. Si l'objet est lourd, fixé, gardé ou dangereux, c'est un jet.
- name : court (1 à 4 mots), sans article ; réutilise exactement le nom déjà présent dans [ÉTAT] pour un objet déjà possédé.
- description : une phrase concrète et visuelle (forme, matière, couleurs) — elle sert aussi à dessiner l'icône de l'objet.
- bonus_stat / bonus_value : seulement pour le vrai équipement (arme, armure, accessoire), de +1 à +3 selon la qualité ; sinon « AUCUN » et 0.
- value : valeur marchande en pièces.
Ce qui est consommé, donné, vendu, perdu ou brisé sort par items_remove, avec le nom exact figurant dans [ÉTAT]. L'argent passe uniquement par gold_change, jamais par un objet. Si le joueur veut utiliser un objet qu'il n'a pas, la fiction le lui fait sentir.

# Santé, progression, repos
- hp_change : négatif pour une blessure, positif pour un soin. Repères pour un héros débutant (10 à 20 PV) : égratignure 1-2, coup sérieux 3-6, blessure grave 7-10. Le programme gère la mort : si les PV tombent à 0, il offre un jet de la dernière chance.
- xp_gain : 5-15 pour une réussite notable, 20-40 pour un obstacle surmonté, 50-100 pour un grand accomplissement. Rien pour les actions banales.
- gold_change : repères de prix — repas 1, nuit à l'auberge 3, arme simple 15-30, objet rare 100 et plus.
- rest : « court » (une pause d'une heure à l'abri : le programme rend un peu de PV et de mana) ou « long » (une vraie nuit en sécurité : tout est restauré). Ne double pas ce soin dans hp_change.
- statuses_add / statuses_remove : états durables en un ou deux mots (Empoisonné, Béni, Recherché…).
- quests : crée une entrée quand un objectif apparaît, puis mets-la à jour (même title) quand elle avance, se termine ou échoue.
- location et time_of_day : toujours renseignés avec le lieu et le moment actuels (quelques mots).
- mood : l'ambiance de la scène.
- choices : 3 ou 4 pistes brèves (8 mots au plus), variées, dont une audacieuse ou inattendue. Vide quand tu demandes un jet.
- ending : « mort » seulement si la fiction rend la mort certaine et définitive ; « fin » si l'histoire atteint une vraie conclusion ; sinon « aucune ».

# Style
Deuxième personne du singulier, au présent. Une prose vive et sensorielle, des personnages qui ont une voix et des envies. En général 60 à 140 mots, davantage pour les grands moments. Pas de listes, pas de chiffres ni de mécanique dans le récit (le programme les affiche). Termine sur une ouverture qui donne envie d'agir, sans demander systématiquement « Que fais-tu ? ». Mise en forme : seulement *italique* et **gras**, avec parcimonie. Reste dans un registre tout public averti : tension, danger et humour noir sont bienvenus, pas de contenu sexuel explicite.`;
}

- le fond reste transparent ; pas de texte, pas de cadre.

const FALLBACK_SPRITE = {

  r: ['................', '......kkkk......', '.....kddddk.....', '......kbbk......', '.....kkaakk.....', '....kaacaaak....', '...kaacaaaaak...', '..kaacaaaaaaak..',
    '..kaaaaaaaaabk..', '..kaaaaaaaaabk..', '..kaaaaaaaabbk..', '..kaaaaaaabbbk..', '...kaaaabbbbk...', '....kkkkkkkk....', '................', '................']

function normalizeSprite(d) {
  const p = {};
  for (const c of (d && d.palette) || []) {
    const k = String(c && c.key || '').trim().charAt(0);
    let h = String(c && c.hex || '').trim().replace(/^#?/, '#');
    if (/^#[0-9a-f]{3}$/i.test(h)) h = '#' + h.slice(1).split('').map(x => x + x).join('');
    if (k && k !== '.' && k !== ' ' && /^#[0-9a-f]{6}$/i.test(h)) p[k] = h.toLowerCase();
  }
  let rows = ((d && d.rows) || []).map(r => String(r == null ? '' : r)).filter(r => r.length > 0);
  if (rows.length > SPRITE_SIZE) rows = rows.slice(0, SPRITE_SIZE);
  const padTop = Math.floor((SPRITE_SIZE - rows.length) / 2);
  const out = [];
  for (let y = 0; y < SPRITE_SIZE; y++) {
    const src = rows[y - padTop] || '';
    let line = '';
    for (let x = 0; x < SPRITE_SIZE; x++) { const ch = src[x]; line += (ch && p[ch]) ? ch : '.'; }
    out.push(line);
  }
  const filled = out.join('').replace(/\./g, '').length;
  if (Object.keys(p).length < 2 || filled < 14) throw new Error('sprite vide');
  return { p, r: out };
}
const spriteURLCache = new Map();
function spriteURL(sp) {
  const key = sp.r.join('') + JSON.stringify(sp.p);
  let url = spriteURLCache.get(key);
  if (url) return url;
  const scale = 6, c = document.createElement('canvas');
  c.width = c.height = SPRITE_SIZE * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < SPRITE_SIZE; y++) for (let x = 0; x < SPRITE_SIZE; x++) {
    const col = sp.p[sp.r[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
  }
  url = c.toDataURL('image/png');
  spriteURLCache.set(key, url);
  return url;
}

async function genSprite(kind, o) {

function queueSprite(kind, id) {

    cur = G && G.id === gid ? spriteTarget(kind, id) : null;   // l'état a pu être rechargé entre-temps
    if (!cur) return;
    if (sp) { cur.sprite = sp; cur.ss = 'ok'; } else cur.ss = 'fail';

  });
}

  let it = G.items.find(i => norm(i.name) === n);
  if (it) return it;
  const c = G.items.filter(i => { const m = norm(i.name); return m && (m.includes(n) || n.includes(m)); });
  c.sort((a, b) => Math.abs(norm(a.name).length - n.length) - Math.abs(norm(b.name).length - n.length));

  // Tout l'historique est stable d'un tour à l'autre : on place le point de cache sur son dernier message.

// ---------------------------------------------------------------- le dé
const D20_SVG = '<polygon class="o" points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5"/><polygon class="i" points="50,22 78,68 22,68"/>' +
  '<path class="l" d="M50,3 L50,22 M91,26.5 L50,22 M9,26.5 L50,22 M91,26.5 L78,68 M9,26.5 L22,68 M91,73.5 L78,68 M9,73.5 L22,68 M50,97 L78,68 M50,97 L22,68"/>';
function dieSVG(n, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('class', cls || 'die d20');
  s.innerHTML = D20_SVG + '<text class="n" x="50" y="58">' + n + '</text>';
  return s;
}
const Dice = {
  // spec : {stat, dc, reason, mana, adv, title, noCancel, plain} → Promise<résultat | null si le joueur renonce>
  ask(spec) {
    return new Promise(resolve => {
      const root = $('#dice'), H = G.hero;
      const parts = rollParts(spec.stat, spec.plain);
      const total = parts.reduce((a, p) => a + p.v, 0);
      const two = spec.adv !== 'normal';
      const mana = S.god ? 0 : Math.max(0, spec.mana || 0);
      const deficit = Math.max(0, mana - H.mana), hpCost = deficit * 2;
      const fatal = hpCost > 0 && hpCost >= H.hp;
      const dice = [dieSVG('?', 'die d20 idle')]; if (two) dice.push(dieSVG('?', 'die d20 idle'));
      const hint = el('div', { class: 'd-hint', text: fatal ? '' : 'Touche le dé pour lancer' });
      const res = el('div', { class: 'd-res' }), verdictEl = el('div', { class: 'd-verdict' });
      const cancel = spec.noCancel ? null : el('button', { class: 'd-cancel', text: 'Renoncer à cette action', onclick: () => finish(null) });
      const dcNote = spec.baseDc != null && spec.baseDc !== spec.dc ? ' · mode ' + DIFFS[G.diff].name : '';
      const card = el('div', { class: 'd-card' },
        el('div', { class: 'd-kick', text: spec.title ? 'Dernier recours' : 'Épreuve' }),
        el('div', { class: 'd-title', text: spec.title || STAT_NAMES[spec.stat] }),
        spec.reason ? el('div', { class: 'd-reason', text: spec.reason }) : null,
        el('div', { class: 'd-dc' }, el('span', { text: 'Difficulté' }), el('b', { text: spec.dc }), el('span', { text: dcLabel(spec.dc) + dcNote })),
        el('div', { class: 'd-mods' }, parts.map((p, i) => [i ? ' · ' : '', p.label + ' ', el('b', { text: fmtMod(p.v) })]), parts.length > 1 ? [' = ', el('b', { text: fmtMod(total) })] : null),
        two ? el('div', { class: 'd-mods', text: spec.adv === 'avantage' ? '▲ Avantage : deux dés, on garde le meilleur' : '▼ Désavantage : deux dés, on garde le pire' }) : null,
        (spec.mana > 0) ? el('div', { class: 'd-mana', text: '✨ Coût : ' + spec.mana + ' mana' + (S.god ? ' (gratuit en mode dieu)' : ' (tu en as ' + H.mana + ')') }) : null,
        hpCost > 0 ? el('div', { class: 'd-warn', text: fatal ? '⚠ Il te manque ' + deficit + ' mana. La surcharge te coûterait ' + hpCost + ' PV : elle te tuerait.' : '⚠ Surcharge : il te manque ' + deficit + ' mana. Lancer quand même te coûtera ' + hpCost + ' PV.' }) : null,
        el('div', { class: 'd-dice' + (two ? ' two' : '') }, dice),
        res, verdictEl, hint, cancel
      );
      root.innerHTML = ''; root.append(card); root.classList.add('on');
      let state = 'idle', result = null, timer = null;
      const finish = r => { if (state === 'done') return; state = 'done'; clearTimeout(timer); root.classList.remove('on'); root.innerHTML = ''; resolve(r); };
      const go = () => {
        if (state !== 'idle' || fatal) return;
        state = 'rolling'; Snd.init(); Snd.dice();
        if (cancel) cancel.style.visibility = 'hidden';
        hint.textContent = '';
        dice.forEach(d => d.setAttribute('class', 'die d20 rolling'));
        const forced = S.god && S.forceDie >= 1 && S.forceDie <= 20 ? S.forceDie : 0;
        const d1 = forced || d20(), d2 = two ? (forced || d20()) : 0;
        const nat = !two ? d1 : spec.adv === 'avantage' ? Math.max(d1, d2) : Math.min(d1, d2);
        const spin = setInterval(() => dice.forEach(d => { d.querySelector('.n').textContent = Math.floor(Math.random() * 20) + 1; }), 70);
        setTimeout(() => {
          clearInterval(spin);
          const sum = nat + total;
          const verdict = nat === 20 ? 'crit' : nat === 1 ? 'fumble' : sum >= spec.dc ? 'success' : (spec.dc - sum <= 2 ? 'near' : 'fail');
          const vals = [d1, d2];
          let kept = false;
          dice.forEach((d, i) => {
            d.querySelector('.n').textContent = vals[i];
            let cls = 'die d20 land';
            if (two && (vals[i] !== nat || kept)) cls += ' drop';
            else { kept = true; if (verdict === 'crit') cls += ' r-crit'; if (verdict === 'fumble') cls += ' r-fumble'; }
            d.setAttribute('class', cls);
          });
          res.textContent = nat + ' ' + (total >= 0 ? '+' : '−') + ' ' + Math.abs(total) + ' = ' + sum + '  contre  ' + spec.dc;
          verdictEl.textContent = VERDICT[verdict].ui; verdictEl.className = 'd-verdict v-' + verdict;
          if (verdict === 'crit') Snd.crit(); else if (verdict === 'success') Snd.good(); else if (verdict === 'fumble') Snd.fumble(); else Snd.bad();
          // paiement de la magie
          let hpPaid = 0;
          if (mana > 0) {
            const pay = Math.min(H.mana, mana); H.mana -= pay;
            if (hpCost > 0) { hpPaid = hpCost; H.hp = Math.max(1, H.hp - hpCost); }
          }
          result = { stat: spec.stat, dc: spec.dc, reason: spec.reason || '', adv: spec.adv, d1, d2, nat, mod: total, total: sum, verdict,
            ok: verdict === 'crit' || verdict === 'success', mana: spec.mana > 0 ? spec.mana : 0, hpPaid, title: spec.title || '' };

        }, 1000);
      };
      dice.forEach(d => d.addEventListener('click', e => { e.stopPropagation(); if (state === 'idle') go(); else if (state === 'shown') finish(result); }));
      card.addEventListener('click', () => { if (state === 'shown') finish(result); });

  }

// ---------------------------------------------------------------- moteur de tour
let turnCtl = null;
async function requestTurn(p) {
  const ctl = turnCtl = new AbortController();
  showThinking(true);
  let live = null;
  try {
    const res = await callClaude({
      system: sysPrompt(), messages: buildMessages(p), schema: TURN_SCHEMA, maxTokens: 6000, tag: p.intro ? 'intro' : (p.roll ? 'issue' : 'tour'), signal: ctl.signal,
      onText: full => {
        const t = partialField(full, 'narrative');
        if (!t) return;
        showThinking(false);
        if (!live) live = liveNarr();
        live.set(t);
      }
    });
    return res.data;
  } finally { if (turnCtl === ctl) turnCtl = null; showThinking(false); if (live) live.remove(); }
}

async function resolveTurn(p) {
  let o = await requestTurn(p);
  if (o.needs_roll && o.roll && !p.roll && !p.intro) {
    const setup = cleanText(o.narrative, 600);
    if (setup) pushLog({ t: 'narr', text: setup, setup: true });
    p.setup = setup;
    const base = clamp(int(o.roll.dc, 11), 2, 40);
    const spec = {
      stat: STATS.includes(o.roll.stat) ? o.roll.stat : 'DEX',
      baseDc: base, dc: clamp(base + DIFFS[G.diff].dc, 2, 40),
      reason: cleanText(o.roll.reason, 200), mana: clamp(int(o.roll.mana_cost), 0, 60),
      adv: ['avantage', 'desavantage'].includes(o.roll.advantage) ? o.roll.advantage : 'normal'
    };
    const r = await Dice.ask(spec);
    if (!r) return 'cancel';
    p.roll = r;
    pushLog(Object.assign({ t: 'roll' }, r));
    o = await requestTurn(p);
  }
  await applyOutcome(o, p);
  return 'ok';
}

async function applyOutcome(o, p) {
  const H = G.hero, chips = [], fx = [], after = [];
  const narrative = cleanText(o.narrative, 4000) || '…';
  pushLog({ t: 'narr', text: narrative, first: !!p.intro });

  // lieu, moment, ambiance
  const loc = cleanText(o.location, 70), tod = cleanText(o.time_of_day, 40);
  if (loc && norm(loc) !== norm(G.location)) {
    G.location = loc;
    if (!G.places.some(x => norm(x) === norm(loc))) { G.places.push(loc); if (G.places.length > 40) G.places.shift(); }
    if (!p.intro) chips.push({ k: 'loc', text: '📍 ' + loc });
  }

  if (MOODS.includes(o.mood)) G.mood = o.mood;

  // repos
  if (o.rest === 'long') {
    H.hp = H.hpMax; H.mana = H.manaMax; H.lastStandUsed = false;
    chips.push({ k: 'heal', text: '🌙 Repos long : PV et mana restaurés' }); fx.push('repos long (PV et mana restaurés)');
  } else if (o.rest === 'court') {

    chips.push({ k: 'heal', text: '☕ Repos court : un peu de PV et de mana' }); fx.push('repos court');
  }

    const before = H.hp;
    H.hp = clamp(H.hp + dhp, S.god ? 1 : 0, H.hpMax);
    const real = H.hp - before;
    if (real) { chips.push({ k: real < 0 ? 'dmg' : 'heal', text: (real > 0 ? '+' : '−') + Math.abs(real) + ' PV' }); fx.push('PV ' + fmtModA(real)); hudPulse(real < 0 ? 'dmg' : 'heal'); }
  }
  // mana
  let dm = int(o.mana_change);
  if (S.god && dm < 0) dm = 0;
  if (dm) {
    const before = H.mana; H.mana = clamp(H.mana + dm, 0, H.manaMax);
    const real = H.mana - before;
    if (real) { chips.push({ k: 'mana', text: (real > 0 ? '+' : '−') + Math.abs(real) + ' mana' }); fx.push('mana ' + fmtModA(real)); }
  }

    const before = H.gold; H.gold = clamp(H.gold + dg, 0, 99999999);
    const real = H.gold - before;
    if (real) { chips.push({ k: 'gold', text: '🪙 ' + (real > 0 ? '+' : '−') + Math.abs(real) }); fx.push('or ' + fmtModA(real)); }
  }

    const out = removeItem(r && r.name, r && r.qty);
    if (out) { chips.push({ k: 'lost', text: '− ' + out.item.name + (out.qty > 1 ? ' ×' + out.qty : '') }); fx.push('objet perdu : ' + out.item.name + (out.qty > 1 ? ' x' + out.qty : '')); }
  }

    const got = addItem(a);
    if (got) { gotLoot = true; after.push({ t: 'loot', id: got.item.id, name: got.item.name, desc: got.item.desc, qty: got.qty }); fx.push('objet obtenu : ' + got.item.name + (got.qty > 1 ? ' x' + got.qty : '')); }
  }

    const sp = addSpell(a);
    if (sp) { gotLoot = true; after.push({ t: 'loot', id: sp.id, kind: 'sort', name: sp.name, desc: sp.desc, cost: sp.cost }); fx.push('sort appris : ' + sp.name); }
  }

    const gone = removeStatus(s);

  }
  for (const s of (Array.isArray(o.statuses_add) ? o.statuses_add : []).slice(0, 6)) {

    const n = norm(title);

    else {

    }
  }
  if (chips.length) pushLog({ t: 'fx', chips });
  after.forEach(e => pushLog(e));
  if (gotLoot) Snd.loot();

  // suite

  G.turn++;
  G.hist.push({ role: 'user', content: userContent(p) });

      }
    }

      H.hp = 0; G.dead = true; G.choices = [];

    }

  }

  // mémoire longue : on condense les tours les plus anciens
  if (G.hist.length >= 36) { try { await summarize(16); } catch (e) {} }
  autosave();
  renderAll();
  if (G.dead) showDeath(); else if (o.ending === 'fin') showEnding();
}

async function summarize(count) {
  const old = G.hist.slice(0, count);
  const transcript = old.map(m => (m.role === 'user' ? 'JOUEUR :\n' : 'RÉCIT :\n') + m.content).join('\n\n');
  showThinking(true, 'Le narrateur consigne la chronique…');
  try {
    const res = await callClaude({
      system: SUMMARY_SYSTEM, maxTokens: 2500, tag: 'chronique',
      messages: [{ role: 'user', content: '[CHRONIQUE EXISTANTE]\n' + (G.summary || '(vide)') + '\n\n[TOURS À INTÉGRER]\n' + transcript }]
    });
    const s = cleanText(res.text, 3000);
    if (s.length > 40) { G.summary = s; G.hist.splice(0, count); }
  } finally { showThinking(false); }
}

function takeSnap() { try { prevSnap = JSON.stringify(G); store.set('vf_prev', G); } catch (e) {} }

async function act(text) {
  text = cleanText(text, 1200);
  if (!text || busy || !G || G.dead) return;
  if (!canNarrate()) { needNarrator(() => act(text)); return; }
  Snd.init();
  takeSnap();
  const p = { action: text, roll: null, setup: '', notes: G.notes, logMark: G.log.length };
  G.notes = [];
  G.choices = []; renderChoices();
  pushLog({ t: 'act', text });
  await runTurn(p);
}
async function runTurn(p) {
  pending = p; setBusy(true);
  let outcome = 'error';
  try { outcome = await resolveTurn(p); }
  catch (e) {
    if (e && e.kind === 'cancelled' && !p.intro) { pending = p; dropPending(true); outcome = 'cancel-done'; }
    else showTurnError(e, p);
  }
  if (outcome === 'cancel') cancelTurn(p, true);
  if (outcome !== 'error') pending = null;
  setBusy(false);
  renderAll();
}
function cancelTurn(p, restoreInput) {
  pending = null;
  if (p.intro) return;
  G.notes = (p.notes || []).concat(G.notes);
  truncateLog(p.logMark);
  if (prevSnap) { try { const s = JSON.parse(prevSnap); G.choices = s.choices || []; } catch (e) {} }
  if (restoreInput) { const inp = $('#inp'); inp.value = p.action; autoGrow(); }
  renderAll();
}
async function startIntro() {
  if (!canNarrate()) { needNarrator(() => startIntro()); return; }
  await runTurn({ intro: true, roll: null, setup: '', notes: [], logMark: 0 });
}
function undoTurn() {
  let snap = prevSnap;
  if (!snap) { const s = store.get('vf_prev'); if (s && G && s.id === G.id) snap = JSON.stringify(s); }
  if (!snap) { toast('Aucun tour à annuler.'); return false; }
  loadState(JSON.parse(snap), true);
  prevSnap = null;
  toast('Retour au tour précédent.');
  return true;
}

        el('span', { text: '❤ ' + x.hp + ' · ✨ ' + x.mana + ' · ' + x.prof.join(' + ') }))))),

      el('div', { class: 'statgrid' }, STATS.map(s => el('div', { class: 'statbox' + (a.prof.includes(s) ? ' prof' : '') },
        el('div', { class: 'nm' }, el('b', { text: STAT_NAMES[s] }), el('small', { text: STAT_HINT[s] })),
        el('button', { class: 'stp', text: '−', disabled: C.stats[s] <= 6, onclick: () => { C.stats[s]--; renderCreate(); } }),
        el('span', { class: 'val', text: C.stats[s] }),
        el('button', { class: 'stp', text: '+', disabled: C.stats[s] >= 18 || left <= 0, onclick: () => { C.stats[s]++; renderCreate(); } }),
        el('span', { class: 'md', text: fmtMod(mod(C.stats[s])) })))),
      el('div', { class: 'row wrap', style: 'margin-top:10px' },
        el('button', { class: 'btn sm', text: '🎲 Tirer au hasard (4d6)', onclick: () => { STATS.forEach(s => { const r = [d6(), d6(), d6(), d6()].sort((x, y) => x - y); C.stats[s] = clamp(r[1] + r[2] + r[3], 6, 18); }); C.budget = STATS.reduce((t, k) => t + C.stats[k], 0); renderCreate(); } }),
        el('button', { class: 'btn sm ghost', text: 'Réinitialiser', onclick: () => { C.stats = Object.assign({}, a.base); C.budget = 72; renderCreate(); } })),
      el('p', { class: 'hint', style: 'margin-top:8px', text: 'Cadre doré = caractéristique maîtrisée (+2 aux jets). Le modificateur s\'ajoute au d20.' })),
    sec('Le ton de la partie', null,
      el('div', { class: 'cards' }, Object.keys(DIFFS).map(k => el('button', { class: 'card' + (C.diff === k ? ' sel' : ''), onclick: () => { C.diff = k; renderCreate(); } },
        el('span', { class: 'ic', text: DIFFS[k].icon }), el('b', { text: DIFFS[k].name }), el('span', { text: DIFFS[k].desc }))))),
    sec('Langue du récit', null, (() => { const s = el('select', { class: 'field', onchange: e => { S.narrLang = e.target.value; saveSettings(); } },
      ['Français', 'English', 'Español', 'Deutsch', 'Italiano', 'Português'].map(l => el('option', { value: l, text: l, selected: S.narrLang === l }))); return s; })())
  );
  $('.c-body').scrollTop = keepScroll;
}
function beginAdventure() {
  if (C.world === 'custom' && C.customWorld.trim().length < 12) { toast('Décris ton monde en quelques mots.'); return; }
  const start = () => {
    Snd.init();
    G = newGameState(C); prevSnap = null; pending = null; UI.tab = 'inv'; UI.sub = null;
    show('game'); renderLog(); renderAll();
    queueSprite('portrait', 'hero');
    startIntro();
  };
  needNarrator(start);
}

// ---------------------------------------------------------------- démarrage
function init() {
  applyTextSize();
  $('#t-new').addEventListener('click', openCreate);
  $('#t-continue').addEventListener('click', () => { const d = store.get('vf_auto'); if (d) loadState(d); });
  $('#t-load').addEventListener('click', () => openSlots('load'));
  $('#t-set').addEventListener('click', () => {
    const body = el('div'); const draw = () => { body.innerHTML = ''; body.append(...buildSettings(false, draw).flat(3).filter(Boolean)); refreshTitle(); };
    draw(); Modal.open({ title: '', wide: true, body });
  });
  $('#c-back').addEventListener('click', () => { show('title'); refreshTitle(); });
  $('#c-go').addEventListener('click', beginAdventure);
  $$('.hb[data-tab]').forEach(b => b.addEventListener('click', () => {
    const t = b.getAttribute('data-tab');
    if (!isWide() && $('#panel').classList.contains('open') && UI.tab === t) closePanel(); else openPanel(t);
  }));
  $('#b-save').addEventListener('click', quickSave);
  $('.p-scrim').addEventListener('click', closePanel);
  $('#hp-bar').addEventListener('click', () => openPanel('hero'));
  $('#mana-bar').addEventListener('click', () => openPanel('spells'));
  $('#send').addEventListener('click', sendInput);
  const inp = $('#inp');
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendInput(); } });
  window.addEventListener('resize', () => { if (G) { renderPanel(); updateHUD(); } });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  refreshTitle();
}
// Démarrage. Dans Claude, la page peut être mise à jour pendant qu'on joue : on reprend alors la partie en cours.
function boot(data) {
  init();
  if (data && data.g) { try { loadState(JSON.parse(data.g)); } catch (e) {} }
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => (G && G.hist.length && !busy ? { g: JSON.stringify(G) } : {})); } catch (e) {}
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
