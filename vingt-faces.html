<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Vingt Faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Jersey+10&display=swap">
<style>
/* Vingt Faces — carnet de donjon nocturne : ardoise bleutée, lumière de torche, pixel art partout.
   Trois voix typographiques : Literata pour lire le récit, Atkinson Hyperlegible pour l'interface,
   Jersey 10 pour les titres de jeu ; les chiffres restent en Atkinson pour être lus sans hésiter. */
:root{
  --bg:#0f1219; --bg2:#151a24; --bg3:#1c2230; --bg4:#252d3e; --line:#2c3446; --line2:#3a4459;
  --ink:#ebe6da; --ink2:#c5cad6; --dim:#949db0; --faint:#677087; --strong:#fff8ea;
  --torch:#f0b14a; --torch2:#c4831e; --on-torch:#1f1406; --speech:#f4d9a6;
  --hp:#e5534b; --hp2:#a7302c; --mana:#57aef7; --mana2:#2b6cc4; --xp:#8bd66b; --coin:#f6cd52;
  --ok:#7fd38a; --bad:#ef7468; --crit:#ffd55c; --near:#e7a75c; --fumble:#ff7b6d;
  --r0:#8f99ad; --r1:#7dcc63; --r2:#57aef7; --r3:#b98af0; --r4:#f6a83a;
  --a2:#7fd38a; --a1:#a9d98a; --a0:#a8b0c0; --am1:#e7a75c; --am2:#ef7468;
  --mood:var(--torch); --shade:#00000066; --scrim:#05070bcc;
  --f-read:"Literata",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-pix:"Jersey 10","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-num:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:18px; --lh:1.62;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --rad:12px;
  color-scheme:dark;
}
body[data-skin="parchemin"]{
  --bg:#f1e9d8; --bg2:#e8dec8; --bg3:#ded2b8; --bg4:#d2c4a6; --line:#c9b994; --line2:#ad9b74;
  --ink:#2b2219; --ink2:#4b3e2f; --dim:#6b5a44; --faint:#8c7a60; --strong:#170f08;
  --torch:#9a520e; --torch2:#7a3f08; --on-torch:#fff7e8; --speech:#7c3410;
  --hp:#c63b33; --hp2:#8c231e; --mana:#2f7fd0; --mana2:#1d5aa0; --xp:#4f9a34; --coin:#b8860b;
  --ok:#2f8a3e; --bad:#b8352b; --crit:#9a6a00; --near:#a35d12; --fumble:#a3231a;
  --r0:#7d7464; --r1:#4f9a34; --r2:#2f7fd0; --r3:#7d4fc0; --r4:#c06a00;
  --a2:#2f8a3e; --a1:#5d8f3a; --a0:#7d7464; --am1:#a35d12; --am2:#b8352b;
  --shade:#3a2a1533; --scrim:#2a1e1299;
  color-scheme:light;
}
body[data-skin="contraste"]{
  --bg:#000; --bg2:#0b0b0b; --bg3:#171717; --bg4:#262626; --line:#5c5c5c; --line2:#8c8c8c;
  --ink:#fff; --ink2:#f2f2f2; --dim:#d4d4d4; --faint:#ababab; --strong:#fff;
  --torch:#ffd23f; --torch2:#e3b400; --on-torch:#000; --speech:#ffe38a;
  --shade:#000000aa; --scrim:#000000e0;
}
body[data-mood="calme"]{--mood:var(--torch)} body[data-mood="tension"]{--mood:#e08a3c}
body[data-mood="combat"]{--mood:#e5534b} body[data-mood="mystere"]{--mood:#a389ec}
body[data-mood="merveille"]{--mood:#4fd1c5} body[data-mood="sombre"]{--mood:#7e8ba3}
body[data-mood="joie"]{--mood:#9fd05a}
body[data-font="atkinson"]{--f-read:"Atkinson Hyperlegible",system-ui,sans-serif}
body[data-font="lexend"]{--f-read:"Lexend",system-ui,sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
::selection{background:var(--torch2);color:var(--on-torch)}
[hidden]{display:none!important}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.pix{font-family:var(--f-pix);font-weight:400;letter-spacing:.02em}
.t-name,.c-top h2,.p-h,.m-title,.d-title,.d-verdict,.devbox h4,.srow .ab,.sbox .ab,.lvl,.god-badge,.tile .e{font-synthesis:none}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ---------- boutons & champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:var(--rad);
  border:1px solid var(--line2);background:var(--bg3);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;text-align:center;
  transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--torch);border-color:var(--torch);color:var(--on-torch)}
.btn.primary:hover{background:var(--torch2)}
.btn.danger{border-color:var(--hp2);color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{border-color:var(--line2)}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn img.px{width:20px;height:20px}
.field{display:block;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);
  background:var(--bg);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--torch)}
textarea.field{resize:vertical;line-height:1.45}
select.field{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.lab{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.hint{font-size:13.5px;color:var(--dim);line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{height:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);
  font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.chip img.px{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:36px;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--bg4);color:var(--ink)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--bg4);border:1px solid var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.sw.on{background:var(--torch2);border-color:var(--torch)} .sw.on::after{left:23px;background:var(--on-torch)}

/* ---------- titre ---------- */
#scr-title{align-items:center;justify-content:center;overflow:auto;text-align:center;
  padding:calc(28px + var(--sat)) max(24px,var(--gr)) calc(28px + var(--sab)) max(24px,var(--gl));
  background:radial-gradient(70% 45% at 50% 22%,color-mix(in srgb,var(--torch) 16%,transparent),transparent 70%),var(--bg)}
.t-wrap{display:flex;flex-direction:column;align-items:center;gap:0;width:min(380px,100%)}
.t-die{width:132px;height:132px;margin-bottom:16px;cursor:default;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 12px 22px var(--shade))}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.t-name{font-family:var(--f-pix);font-weight:400;font-size:clamp(64px,19vw,104px);line-height:.85;color:var(--torch);letter-spacing:.03em;text-wrap:balance;
  text-shadow:0 3px 0 var(--torch2),0 6px 0 var(--shade)}
.t-sub{font-family:var(--f-read);font-style:italic;color:var(--ink2);font-size:17px;line-height:1.5;margin:16px 0 26px;text-wrap:balance}
.t-menu{display:flex;flex-direction:column;gap:10px;width:100%}
.t-foot{margin-top:24px;font-size:12.5px;color:var(--faint);line-height:1.5}

/* ---------- création ---------- */
.c-head{padding:calc(10px + var(--sat)) var(--gr) 10px var(--gl);border-bottom:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:8px}
.c-top{display:flex;align-items:center;gap:10px}
.c-top h2{flex:1;min-width:0;font-family:var(--f-pix);font-weight:400;font-size:28px;line-height:1;color:var(--torch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-step{font-size:13px;color:var(--dim);font-weight:700}
.c-prog{display:flex;gap:6px}
.c-prog i{flex:1;height:4px;border-radius:2px;background:var(--bg4)}
.c-prog i.on{background:var(--torch)}
.c-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px var(--gr) 32px var(--gl)}
.c-wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.c-sec{display:flex;flex-direction:column;gap:12px}
.c-sec>h3{font-family:var(--f-read);font-weight:600;font-size:21px;line-height:1.25;text-wrap:balance}
.c-sec>h3 small{display:block;font-family:var(--f-ui);font-size:13.5px;font-weight:400;color:var(--dim);margin-top:4px}
.c-foot{padding:10px var(--gr) calc(10px + var(--sab)) var(--gl);border-top:1px solid var(--line);background:var(--bg2)}
.c-foot .row{max-width:760px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:10px}
.card{position:relative;text-align:left;padding:12px;border-radius:var(--rad);border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:5px;min-width:0}
.card:hover{border-color:var(--line2)}
.card b{font-size:15px;line-height:1.25}
.card span{font-size:13px;color:var(--dim);line-height:1.4}
.card .meta{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.02em}
.card.sel{border-color:var(--torch);background:color-mix(in srgb,var(--torch) 10%,var(--bg2));box-shadow:0 0 0 1px var(--torch) inset}
.card .ic{width:32px;height:32px;margin-bottom:2px}
.card.world{padding:0;overflow:hidden}
.card.world .band{height:34px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px}
.card.world .band img{width:20px;height:20px;opacity:.95}
.card.world .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card.world .in span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 40px;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2)}
.srow.prof{border-color:color-mix(in srgb,var(--torch) 55%,var(--line))}
.srow .ab{font-family:var(--f-pix);font-size:22px;font-weight:400;color:var(--torch);text-align:center}
.srow .nm b{display:block;font-size:14.5px}
.srow .nm small{display:block;font-size:12.5px;color:var(--dim);line-height:1.35}
.srow .ctl{display:flex;align-items:center;gap:6px}
.srow .val{font-family:var(--f-num);font-weight:700;font-size:19px;width:28px;text-align:center}
.srow .md{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--ink2);text-align:right}
.stp{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--bg3);font-size:19px;font-weight:700;line-height:1}
.stp:disabled{opacity:.3}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-size:14px;font-weight:700;color:var(--ink2)}
.pick.on{background:var(--torch);border-color:var(--torch);color:var(--on-torch)}
.pick small{font-weight:400;opacity:.8;margin-left:4px}
.summary{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--rad);border:1px solid var(--line2);background:var(--bg2)}
.summary img.px{width:64px;height:64px}

/* ---------- jeu : HUD ---------- */
#scr-game{background:radial-gradient(120% 340px at 50% -120px,color-mix(in srgb,var(--mood) 13%,transparent),transparent 72%),var(--bg);transition:background .8s}
#hud{padding:calc(8px + var(--sat)) var(--gr) 8px var(--gl);background:color-mix(in srgb,var(--bg2) 94%,transparent);border-bottom:1px solid var(--line);
  position:relative;z-index:3;display:flex;flex-direction:column;gap:7px}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--mood),transparent);opacity:.8}
.hud-top{display:flex;align-items:center;gap:10px;min-width:0}
.hud-loc{flex:1;min-width:0;display:flex;flex-direction:column}
.hud-loc b{font-family:var(--f-read);font-weight:600;font-size:16.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-loc small{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-res{display:flex;align-items:center;gap:10px;flex:none}
.res{display:flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.res img.px{width:18px;height:18px}
.lvl{font-family:var(--f-pix);font-size:17px;font-weight:400;padding:3px 8px;border-radius:7px;background:var(--bg4);color:var(--ink2);white-space:nowrap}
.lvl b{color:var(--strong);font-size:15px;font-family:var(--f-num)}
.god-badge{font-family:var(--f-pix);font-size:15px;font-weight:400;letter-spacing:.08em;color:#1a1305;background:var(--crit);border-radius:6px;padding:3px 7px}
.hud-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}
.bar img.px{width:18px;height:18px}
.track{flex:1;min-width:0;height:18px;border-radius:5px;background:var(--bg);border:1px solid var(--line2);position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.hp .track i{background:linear-gradient(180deg,var(--hp),var(--hp2))}
.bar.mana .track i{background:linear-gradient(180deg,var(--mana),var(--mana2))}
.track span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#fff;text-shadow:0 1px 0 #000a,0 0 3px #000a;white-space:nowrap}
.xpbar{height:4px;border-radius:2px;background:var(--bg4);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--xp);transition:width .5s}
.hud-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.hb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:46px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg3);font-size:11px;font-weight:700;color:var(--dim);min-width:0}
.hb img.px{width:22px;height:22px}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.hb.on{border-color:var(--torch);color:var(--ink);background:color-mix(in srgb,var(--torch) 12%,var(--bg3))}
.hb .dot{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--torch);color:var(--on-torch);font-size:11px;font-weight:700;line-height:18px;padding:0 5px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.glow{animation:glow .7s}
@keyframes glow{40%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 60%,transparent)}}

/* ---------- adversaires ---------- */
#foes{display:flex;gap:8px;overflow-x:auto;padding:8px var(--gr) 8px var(--gl);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--hp) 7%,var(--bg));scrollbar-width:none;z-index:2}
#foes::-webkit-scrollbar{display:none}
.foe{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;border:1px solid color-mix(in srgb,var(--hp) 45%,var(--line));background:var(--bg2);min-width:170px;max-width:240px;text-align:left}
.foe .ft{flex:1;min-width:0}
.foe b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe .fb{height:8px;border-radius:3px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;margin-top:3px}
.foe .fb i{display:block;height:100%;background:var(--hp)}
.foe small{font-family:var(--f-num);font-weight:700;font-size:11.5px;color:var(--dim)}
.foe.down{opacity:.5}

/* ---------- récit ---------- */
#game-body{flex:1;min-height:0;display:flex}
#game-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px var(--gr) 12px var(--gl);scroll-behavior:smooth}
#log-in{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.e-narr{font-family:var(--f-read);font-size:var(--fs);line-height:var(--lh);color:var(--ink);animation:fadeup .35s;overflow-wrap:break-word}
.e-narr p{margin:0 0 .8em} .e-narr p:last-child{margin-bottom:0}
.e-narr b{font-weight:600;color:var(--strong)} .e-narr i{font-style:italic}
.e-narr .q{color:var(--speech)}
.e-narr.setup{color:var(--ink2);font-style:italic}
.e-narr.live::after{content:"▍";color:var(--mood);animation:blink 1s steps(2) infinite;margin-left:2px}
.e-narr .say{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--dim)}
.e-narr .say img.px{width:16px;height:16px}
.e-narr .say.on{color:var(--torch);border-color:var(--torch)}
@keyframes blink{50%{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.e-act{display:flex;justify-content:flex-end;animation:fadeup .25s}
.e-act span{max-width:86%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--bg3);border:1px solid var(--line2);color:var(--ink);
  font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:break-word}
.e-roll{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rad);border:1px solid var(--line);background:var(--bg2);animation:fadeup .3s}
.e-roll .rb{width:46px;height:46px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:21px;
  background:var(--bg4);border:2px solid var(--line2);color:var(--strong)}
.e-roll .rt{flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:var(--dim)}
.e-roll .rt b{color:var(--ink)}
.e-roll .rv{display:block;font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px}
.v-crit .rb{border-color:var(--crit);color:var(--crit)} .v-crit .rv{color:var(--crit)}
.v-success .rb{border-color:var(--ok)} .v-success .rv{color:var(--ok)}
.v-near .rb{border-color:var(--near)} .v-near .rv{color:var(--near)}
.v-fail .rb{border-color:var(--bad)} .v-fail .rv{color:var(--bad)}
.v-fumble .rb{border-color:var(--fumble);color:var(--fumble)} .v-fumble .rv{color:var(--fumble)}
.e-fx{display:flex;flex-wrap:wrap;gap:6px;animation:fadeup .3s}
.chip.dmg{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.chip.heal{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.mana{color:var(--mana);border-color:color-mix(in srgb,var(--mana) 45%,var(--line))}
.chip.gold{color:var(--coin);border-color:color-mix(in srgb,var(--coin) 45%,var(--line))}
.chip.xp{color:var(--xp);border-color:color-mix(in srgb,var(--xp) 45%,var(--line))}
.chip.st{color:var(--r3);border-color:color-mix(in srgb,var(--r3) 45%,var(--line))}
.chip.rep{color:var(--ink2)}
.e-loot{display:flex;align-items:center;gap:11px;padding:5px 12px 5px 6px;margin-top:-6px;border-radius:var(--rad);border:1px solid var(--line);background:var(--bg2);animation:fadeup .35s;cursor:pointer;text-align:left;width:100%}
.e-loot .lt{flex:1;min-width:0}
.e-loot .lt small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.e-loot .lt b{font-size:15px}
.e-loot .lt span{display:block;font-size:13px;color:var(--dim);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sys{text-align:center;font-size:13.5px;color:var(--dim);padding:2px 10px;animation:fadeup .3s;text-wrap:balance}
.e-sys.big{color:var(--torch);font-size:15px;font-weight:700}
.e-sys.ach{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--coin);font-weight:700}
.e-sys.ach img.px{width:20px;height:20px}
.e-err{padding:12px 14px;border-radius:var(--rad);border:1px solid var(--hp2);background:color-mix(in srgb,var(--hp) 10%,var(--bg2));color:var(--ink);font-size:14.5px;line-height:1.45}
.e-err .row{margin-top:10px}
.e-think{display:flex;align-items:center;gap:10px;color:var(--dim);font-family:var(--f-read);font-style:italic;font-size:15.5px}
.e-think img.px{width:26px;height:26px;animation:spin 1.6s steps(8) infinite}
.e-think span{flex:1;min-width:0}
.e-think button{font-family:var(--f-ui);font-style:normal;font-size:13px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;min-height:32px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- barre de saisie ---------- */
#dock{padding:8px var(--gr) calc(10px + var(--sab)) var(--gl);border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 96%,transparent)}
#dock-in{max-width:700px;margin:0 auto}
#choices{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#choices::-webkit-scrollbar{display:none}
#choices:empty{display:none}
.choice{flex:none;max-width:80vw;padding:8px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--bg3);font-size:14px;line-height:1.3;text-align:left;color:var(--ink)}
.choice:hover{border-color:var(--mood)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.dk{width:46px;height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex:none}
.dk img.px{width:24px;height:24px}
#act-btn{font-size:28px;font-weight:700;line-height:1;color:var(--torch)}
.dk.rec{border-color:var(--hp);background:color-mix(in srgb,var(--hp) 18%,var(--bg3));animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--hp) 30%,transparent)}}
#inp{flex:1;min-width:0;min-height:46px;max-height:140px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);font-size:16px;line-height:1.35;resize:none;outline:none;font-family:var(--f-ui)}
#inp:focus{border-color:var(--mood)}
#send{width:46px;height:46px;border-radius:14px;background:var(--torch);color:var(--on-torch);font-size:21px;font-weight:700;flex:none}
#dock.busy #send,#dock.busy .choice,#dock.busy #act-btn{opacity:.4;pointer-events:none}

/* ---------- panneau ---------- */
#panel{position:fixed;inset:0;z-index:20;display:none}
#panel.open{display:block}
.p-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.p-card{position:absolute;left:0;right:0;bottom:0;height:92%;background:var(--bg2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:slideup .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.p-tabs{display:flex;gap:3px;padding:8px max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);align-items:flex-end}
.p-tab{flex:1;min-width:0;padding:7px 2px 8px;border-radius:10px 10px 0 0;font-size:12px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;border-bottom:0}
.p-tab img.px{width:22px;height:22px}
.p-tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.p-tab.on{background:var(--bg);border-color:var(--line);color:var(--torch)}
.p-close{width:40px;height:40px;font-size:20px;color:var(--dim);margin-bottom:6px;flex:none}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px var(--gr) calc(22px + var(--sab)) var(--gl);background:var(--bg)}
.p-h{font-family:var(--f-pix);font-weight:400;font-size:29px;color:var(--torch);line-height:1.2}
.p-sub{font-size:13.5px;color:var(--dim);margin:4px 0 14px;line-height:1.45}
.sec-t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{color:var(--faint);font-family:var(--f-read);font-style:italic;padding:16px 4px;text-align:center;line-height:1.5}
.back{font-size:14px;font-weight:700;color:var(--dim);margin-bottom:12px;display:inline-flex;gap:6px;align-items:center;min-height:34px}

/* sac */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 calc(-1 * var(--gr)) 10px calc(-1 * var(--gl));padding-left:var(--gl);padding-right:var(--gr);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filt{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.filt img.px{width:20px;height:20px}
.filt i{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:12.5px;color:var(--dim)}
.filt.on{border-color:var(--torch);background:color-mix(in srgb,var(--torch) 14%,var(--bg2));color:var(--ink)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar .field{min-height:40px;padding:8px 12px;font-size:15px}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);padding:10px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:104px;min-width:0;
  box-shadow:inset 0 -3px 0 var(--rar,transparent)}
.tile:hover{border-color:var(--line2)}
.tile.eq{border-color:var(--torch)}
.tile .nm{font-size:12px;line-height:1.25;text-align:center;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:0 2px}
.tile .q{position:absolute;top:5px;right:5px;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--on-torch);background:var(--torch);border-radius:5px;padding:0 5px;line-height:17px}
.tile .e{position:absolute;top:4px;left:6px;font-family:var(--f-pix);font-size:14px;font-weight:400;color:var(--torch)}
.tile .new{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--bg2)}
.spr-pend{position:relative;border-radius:8px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.spr-pend::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--torch) 22%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.2s linear infinite}
.spr-pend img.px{opacity:.3;width:60%!important;height:60%!important}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.det-top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.frame{padding:8px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);flex:none;box-shadow:inset 0 -4px 0 var(--rar,transparent)}
.det-top h3{font-family:var(--f-read);font-weight:600;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.tag img.px{width:14px;height:14px}
.det-desc{font-family:var(--f-read);font-size:17px;line-height:1.6;color:var(--ink);margin-bottom:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* héros */
.hero-top{display:flex;gap:14px;align-items:center}
.hero-top h3{font-family:var(--f-read);font-weight:600;font-size:23px;line-height:1.2}
.hero-top p{font-size:14px;color:var(--dim);line-height:1.4;margin-top:2px}
.xpline{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--f-num);font-weight:700;font-size:12.5px;color:var(--dim)}
.xpline .xpbar{flex:1;height:6px}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbox{position:relative;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);padding:9px 6px 8px;text-align:center;min-width:0}
.sbox.prof{border-color:color-mix(in srgb,var(--torch) 60%,var(--line))}
.sbox .ab{font-family:var(--f-pix);font-size:20px;font-weight:400;line-height:1;color:var(--torch)}
.sbox .v{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.1;color:var(--strong)}
.sbox .fn{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .bn{display:inline-block;margin-top:3px;font-family:var(--f-num);font-weight:700;font-size:13px;padding:0 7px;border-radius:6px;background:var(--bg4);color:var(--ink)}
.sbox .plus{position:absolute;top:-9px;right:-7px;width:28px;height:28px;border-radius:50%;background:var(--torch);color:var(--on-torch);font-weight:700;font-size:18px;line-height:28px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px}
.sk{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);min-width:0;text-align:left}
.sk .d{width:9px;height:9px;flex:none;transform:rotate(45deg);border:1.5px solid var(--faint)}
.sk.on .d{background:var(--torch);border-color:var(--torch)}
.sk .n{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .st{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em}
.sk .b{font-family:var(--f-num);font-weight:700;font-size:14px;min-width:28px;text-align:right}
.sk.pickable{border-style:dashed;border-color:var(--torch)}
.doll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:1px dashed var(--line2);border-radius:var(--rad);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;background:var(--bg2);min-width:0;text-align:center}
.slot.full{border-style:solid;border-color:var(--line2);box-shadow:inset 0 -3px 0 var(--rar,transparent)}
.slot small{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.slot span{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.slot .ghost{opacity:.22;filter:grayscale(1)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{text-align:right;font-weight:700}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.ach{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.ach img.px{width:26px;height:26px}
.ach b{display:block;font-size:13.5px;line-height:1.25}
.ach small{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.ach.off{opacity:.55} .ach.off img.px{filter:grayscale(1);opacity:.5}

/* magie */
.gauge{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--rad);background:var(--bg2);border:1px solid var(--line);margin-bottom:14px}
.gauge img.px{width:28px;height:28px}
.gauge .track{height:14px}
.gauge b{font-family:var(--f-num);font-size:17px;white-space:nowrap}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);margin-bottom:8px;text-align:left;width:100%;min-width:0}
.li:hover{border-color:var(--line2)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:15px;line-height:1.3}
.li .lt span{display:block;font-size:13.5px;color:var(--dim);line-height:1.4}
.li .cost{font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--mana);white-space:nowrap;display:flex;align-items:center;gap:4px}
.li .cost img.px{width:16px;height:16px}
.rules{font-size:13.5px;color:var(--ink2);line-height:1.5;padding:12px 14px;border-radius:var(--rad);border:1px solid var(--line);background:var(--bg2);margin-top:12px}
.rules b{color:var(--ink)}

/* monde */
.quest{padding:11px 13px;border-left:3px solid var(--torch);background:var(--bg2);border-radius:0 10px 10px 0;margin-bottom:8px}
.quest.done{border-left-color:var(--ok);opacity:.8} .quest.fail{border-left-color:var(--bad);opacity:.65}
.quest b{display:block;font-size:15px} .quest span{font-size:13.5px;color:var(--dim);line-height:1.45}
.npc .att{font-size:11.5px}
.npc.dead{opacity:.55}
.fac{padding:10px 12px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);margin-bottom:8px}
.fac .row b{flex:1;min-width:0;font-size:14.5px}
.fac .meter{position:relative;height:8px;border-radius:4px;background:var(--bg4);margin-top:8px;overflow:hidden}
.fac .meter::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.fac .meter i{position:absolute;top:0;bottom:0}
.fac small{display:block;font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.4}
.mapbox{border:1px solid var(--line);border-radius:var(--rad);background:var(--bg2);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:62vh;touch-action:manipulation}
.mapbox .edge{stroke:var(--line2);stroke-width:2;stroke-dasharray:4 4}
.mapbox .node{fill:var(--bg4);stroke:var(--dim);stroke-width:2;cursor:pointer}
.mapbox .node.cur{fill:var(--torch);stroke:var(--strong)}
.mapbox .node.sel{stroke:var(--torch);stroke-width:3}
.mapbox .halo{fill:none;stroke:var(--torch);stroke-width:2;opacity:.5;animation:halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{from{transform:scale(.6);opacity:.8}to{transform:scale(1.6);opacity:0}}
.mapbox text{font-family:var(--f-ui);font-size:11px;font-weight:700;fill:var(--ink2);paint-order:stroke;stroke:var(--bg2);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.placecard{margin-top:10px;padding:12px;border-radius:var(--rad);border:1px solid var(--line2);background:var(--bg2)}
.chron{font-family:var(--f-read);font-size:16px;line-height:1.65;color:var(--ink);white-space:pre-wrap}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats4 div{padding:10px 6px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);text-align:center;min-width:0}
.stats4 b{display:block;font-family:var(--f-num);font-size:21px;color:var(--strong)}
.stats4 small{font-size:11.5px;color:var(--dim)}

/* réglages */
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row .grow b{display:block;font-size:15px} .set-row .grow small{color:var(--dim);font-size:13px;line-height:1.4;display:block}
.set-row select.field{width:auto;min-width:140px;min-height:40px;padding-top:7px;padding-bottom:7px}
.devbox{border:1px dashed var(--crit);border-radius:var(--rad);padding:12px;margin-top:16px;background:color-mix(in srgb,var(--crit) 6%,var(--bg))}
.devbox h4{margin:0 0 8px;color:var(--crit);font-family:var(--f-pix);font-weight:400;font-size:21px;letter-spacing:.06em}
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
pre.dump{font-family:var(--f-mono);font-size:11px;line-height:1.4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:55vh;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2);margin:0}

/* ---------- modales ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) var(--gr) calc(16px + var(--sab)) var(--gl);background:var(--scrim);animation:fade .2s}
.modal.sheet{align-items:flex-end;padding-bottom:0}
.m-card{width:min(480px,100%);max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:18px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.sheet .m-card{border-radius:18px 18px 0 0;padding-bottom:calc(18px + var(--sab));animation:slideup .22s cubic-bezier(.2,.8,.2,1)}
.m-card.wide{width:min(660px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.m-title{font-family:var(--f-pix);font-weight:400;font-size:28px;line-height:1.1;color:var(--torch);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.m-title span{flex:1;min-width:0}
.m-x{width:36px;height:36px;color:var(--dim);font-size:19px}
.m-text{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:14px}
.m-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.m-acts .btn{flex:1;min-width:130px}
.slotc{border:1px solid var(--line);border-radius:var(--rad);padding:10px 12px;margin-bottom:8px;background:var(--bg)}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function cleanText(s, max) {
  s = String(s == null ? '' : s).replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').trim();
  if (max && s.length > max) s = s.slice(0, max - 1).trimEnd() + '…';
  return s;
}
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+x\s*\d+$/, '').replace(/[’']/g, ' ')
    .replace(/^(une|un|des|les|le|la|du|de|l|d|the|an|a)\s+/, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
// Mini-markdown : **gras**, *italique*, paragraphes ; les répliques entre guillemets prennent la couleur des dialogues.
function md(t) {
  let s = esc(t).replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+?)\*/g, '<i>$1</i>');
  s = s.replace(/«[^»]{1,600}»/g, m => '<span class="q">' + m + '</span>').replace(/“[^”]{1,600}”/g, m => '<span class="q">' + m + '</span>');
  return s.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}
const plainText = t => String(t || '').replace(/\*\*?/g, '').replace(/\s+/g, ' ').trim();
function d20() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 20 + 1; }
  catch (e) { return Math.floor(Math.random() * 20) + 1; }
}

}

const Snd = {
  ctx: null,
  init() {
    if (!S.sound) return;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e) {}
  },
  tone(f, dur, type, vol, delay) {
    if (!S.sound || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  dice() { for (let i = 0; i < 10; i++) this.tone(170 + Math.random() * 260, 0.045, 'square', 0.045, i * 0.085 + Math.random() * 0.02); },

const pixCache = new Map();
function pixURL(rows, pal) {
  const key = rows.join('') + '|' + (pal === PAL ? '' : JSON.stringify(pal));
  let url = pixCache.get(key);
  if (url) return url;
  const sc = 8, c = document.createElement('canvas');
  c.width = c.height = 16 * sc;
  const g = c.getContext('2d');
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const col = pal[(rows[y] || '')[x]];
    if (col) { g.fillStyle = col; g.fillRect(x * sc, y * sc, sc, sc); }
  }
  url = c.toDataURL('image/png');
  pixCache.set(key, url);
  return url;
}
const icURL = name => pixURL(ICONS[name] || ICONS.box, PAL);
function ic(name, size, cls) { return el('img', { class: 'px' + (cls ? ' ' + cls : ''), src: icURL(name), width: size, height: size, alt: '' }); }
function fillIcons(root) { $$('img[data-ic]', root).forEach(i => { i.src = icURL(i.getAttribute('data-ic')); }); }

// Normalise un sprite renvoyé par l'IA : palette (liste, objet ou texte), 16 lignes de 16 caractères.
function normalizeSprite(d) {
  const p = {};
  let pal = d && d.palette;
  if (typeof pal === 'string') pal = pal.split(/[\s,;]+/).map(x => { const m = x.split(/[=:]/); return { key: m[0], hex: m[1] }; });
  else if (pal && !Array.isArray(pal) && typeof pal === 'object') pal = Object.keys(pal).map(k => ({ key: k, hex: pal[k] }));
  for (const c of pal || []) {
    const k = String(c && c.key || '').trim().charAt(0);
    let h = String(c && c.hex || '').trim().replace(/^#?/, '#');
    if (/^#[0-9a-f]{3}$/i.test(h)) h = '#' + h.slice(1).split('').map(x => x + x).join('');
    if (k && k !== '.' && k !== ' ' && /^#[0-9a-f]{6}$/i.test(h)) p[k] = h.toLowerCase();
  }
  let rows = ((d && d.rows) || []).map(r => String(r == null ? '' : r)).filter(r => r.length > 0);
  if (rows.length > 16) rows = rows.slice(0, 16);
  const padTop = Math.floor((16 - rows.length) / 2);
  const out = [];
  for (let y = 0; y < 16; y++) {
    const src = rows[y - padTop] || '';
    let line = '';
    for (let x = 0; x < 16; x++) { const ch = src[x]; line += (ch && p[ch]) ? ch : '.'; }
    out.push(line);
  }
  const filled = out.join('').replace(/\./g, '').length;
  if (Object.keys(p).length < 2 || filled < 14) throw new Error('sprite vide');
  return { p, r: out };
}

}

// Lit, pendant le streaming, la valeur (partielle) d'un champ texte de premier niveau d'un JSON incomplet.
function partialField(buf, key) {
  let i = 0, depth = 0, inStr = false, strStart = 0, lastStr = null, pendingKey = null;
  const n = buf.length;
  while (i < n) {
    const c = buf[i];
    if (inStr) {
      if (c === '\\') { i += 2; continue; }
      if (c === '"') { inStr = false; lastStr = buf.slice(strStart, i); }
      i++; continue;
    }
    if (c === '"') {
      if (depth === 1 && pendingKey === key) return decodePartialString(buf, i + 1);
      inStr = true; strStart = i + 1;
    } else if (c === '{' || c === '[') { depth++; if (depth > 1) pendingKey = null; }
    else if (c === '}' || c === ']') depth--;
    else if (c === ':') { if (depth === 1 && lastStr != null) pendingKey = lastStr; }
    else if (c === ',') { if (depth === 1) pendingKey = null; }
    i++;
  }

}
function decodePartialString(buf, start) {

  raw = raw.replace(/\\u[0-9a-fA-F]{0,3}$/, '').replace(/(^|[^\\])((?:\\\\)*)\\$/, '$1$2');

}

  const out = [], stack = [];
  let inStr = false, escp = false;
  for (let i = 0; i < buf.length; i++) {
    const c = buf[i];
    if (inStr) { if (escp) escp = false; else if (c === '\\') escp = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') { inStr = true; continue; }
    if (c === '{' || c === '[') { stack.push({ c, i }); continue; }
    if (c === '}' || c === ']') {

      if (c === '}' && top && top.c === '{') {
        const s = buf.slice(top.i, i + 1);
        if (s.indexOf('"rows"') >= 0) { try { const o = JSON.parse(s); if (Array.isArray(o.rows)) out.push(o); } catch (e) {} }

}

// --- voie 1 : l'API Anthropic avec la clé du joueur (Koder, navigateur)
function makeAccumulator(onText) {
  return {
    blocks: [], stop: null, usage: { in: 0, out: 0, cr: 0, cw: 0 }, model: null,
    text() { return this.blocks.filter(b => b && b.type === 'text').map(b => b.text).join(''); },
    handle(ev) {
      if (!ev || !ev.type) return;
      if (ev.type === 'message_start' && ev.message) {
        this.model = ev.message.model;
        const u = ev.message.usage || {};
        this.usage.in = u.input_tokens || 0; this.usage.cr = u.cache_read_input_tokens || 0; this.usage.cw = u.cache_creation_input_tokens || 0;
      } else if (ev.type === 'content_block_start') {
        const cb = ev.content_block || {};
        this.blocks[ev.index] = { type: cb.type, text: cb.text || '' };
      } else if (ev.type === 'content_block_delta') {
        const b = this.blocks[ev.index];
        if (b && ev.delta && ev.delta.type === 'text_delta') { b.text += ev.delta.text || ''; if (onText) onText(this.text()); }
      } else if (ev.type === 'message_delta') {
        if (ev.delta && ev.delta.stop_reason) this.stop = ev.delta.stop_reason;
        if (ev.usage && ev.usage.output_tokens != null) this.usage.out = ev.usage.output_tokens;
      } else if (ev.type === 'error') {
        const er = ev.error || {};
        throw mapApiError(er.type === 'overloaded_error' ? 529 : 500, er);
      }

}
function feedSSE(acc, state, chunk) {

    const block = state.buf.slice(0, m.index);
    state.buf = state.buf.slice(m.index + m[0].length);
    const data = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
    if (!data || data === '[DONE]') continue;
    let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
    acc.handle(ev);
  }
}

  const type = (er && er.type) || '', msg = (er && er.message) || '';
  if (status === 401) return new ApiError('Clé API refusée. Vérifie ta clé Anthropic dans les options.', 'auth', status);
  if (status === 403) return new ApiError('Cette clé API n\'a pas accès à ce modèle. ' + msg, 'auth', status);
  if (status === 429) return new ApiError('Limite de requêtes atteinte. Patiente quelques secondes.', 'rate', status);
  if (status === 529 || type === 'overloaded_error') return new ApiError('Les serveurs de Claude sont surchargés. Réessaie dans un instant.', 'overloaded', status);
  if (status >= 500) return new ApiError('Erreur du serveur Claude (' + status + ').', 'server', status);
  if (status === 400 && /fallback|anthropic-beta|beta/i.test(msg)) return new ApiError(msg, 'fallback-unsupported', status);
  if (/credit balance|billing/i.test(msg)) return new ApiError('Ton compte API n\'a plus de crédit. Recharge-le sur platform.claude.com, puis réessaie.', 'billing', status);

}
async function callApi(opt) {
  const model = opt.art ? ART_MODEL : MODEL;
  const body = {
    model, max_tokens: opt.maxTokens || 16000, stream: true,
    output_config: { effort: opt.art ? 'low' : S.storyEffort },
    // Le prompt système est stable pendant toute la partie : on le met en cache.
    system: [{ type: 'text', text: opt.system, cache_control: { type: 'ephemeral' } }],
    messages: opt.messages
  };
  if (opt.schema) body.output_config.format = { type: 'json_schema', schema: opt.schema };
  // L'artiste dessine sans réfléchir d'abord : le premier pixel arrive tout de suite.
  if (opt.art) body.thinking = { type: 'disabled' };
  const headers = { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': API_VERSION, 'anthropic-dangerous-direct-browser-access': 'true' };
  // Repli automatique côté serveur si un filtre de sécurité décline la requête (Sonnet seulement).
  if (S.useFallbacks && model === MODEL) { body.fallbacks = 'default'; headers['anthropic-beta'] = FALLBACK_BETA; }
  if (opt.art) DEV.lastArt = { at: Date.now(), body }; else DEV.lastReq = { tag: opt.tag, at: Date.now(), body };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 300000);
  const stopped = () => !!(opt.signal && opt.signal.aborted);
  if (opt.signal) { if (opt.signal.aborted) ctl.abort(); else opt.signal.addEventListener('abort', () => ctl.abort(), { once: true }); }

    let resp;

    catch (e) {
      if (stopped()) throw new ApiError('Action annulée.', 'cancelled');
      throw new ApiError(ctl.signal.aborted ? 'Le narrateur met trop de temps à répondre.' : 'Impossible de joindre l\'API Claude. Vérifie ta connexion Internet.', 'network');
    }
    if (!resp.ok) {
      let er = null;
      try { const j = await resp.json(); er = j && j.error; } catch (e) {}
      throw mapApiError(resp.status, er);
    }
    const acc = makeAccumulator(opt.onText), st = { buf: '' };
    try {
      if (resp.body && typeof resp.body.getReader === 'function' && typeof TextDecoder !== 'undefined') {
        const reader = resp.body.getReader(), dec = new TextDecoder();
        for (;;) {
          const { done, value } = await reader.read();

        feedSSE(acc, st, '\n\n');
      } else feedSSE(acc, st, (await resp.text()) + '\n\n');
    } catch (e) {
      if (e instanceof ApiError) throw e;
      if (stopped()) throw new ApiError('Action annulée.', 'cancelled');
      throw new ApiError(ctl.signal.aborted ? 'Le narrateur met trop de temps à répondre.' : 'La connexion a été coupée pendant la réponse.', 'network');
    }
    addUsage(acc.model && acc.model.indexOf('haiku') >= 0 ? ART_MODEL : model, acc.usage);
    const text = acc.text();
    const res = { tag: opt.tag, stop: acc.stop, model: acc.model, usage: acc.usage, text };
    if (opt.art) DEV.lastArt.res = res; else DEV.lastRes = res;
    if (acc.stop === 'refusal') throw new ApiError('Le narrateur a décliné cette demande.', 'refusal');
    if (!opt.schema) return { text };
    const data = parseLooseJSON(text);
    if (!data) throw new ApiError(acc.stop === 'max_tokens' ? 'La réponse du narrateur a été tronquée.' : 'Réponse illisible du narrateur.', 'server');
    return { data, text };
  } finally { clearTimeout(timer); }
}

// Décrit un schéma JSON en clair : sans sortie contrainte, le narrateur intégré a besoin de voir la forme attendue.
function schemaHint(sc) {
  if (sc.anyOf) return sc.anyOf.map(schemaHint).join(' ou ');
  if (sc.type === 'null') return 'null';
  if (sc.type === 'object') return '{' + Object.keys(sc.properties).map(k => JSON.stringify(k) + ': ' + schemaHint(sc.properties[k])).join(', ') + '}';
  if (sc.type === 'array') return '[' + schemaHint(sc.items) + ', …]';
  if (sc.enum) return JSON.stringify(sc.enum.join('|'));
  if (sc.type === 'integer') return '0';
  if (sc.type === 'boolean') return 'true|false';
  return '"…"';
}
function sampleInput(opt) {
  const txt = m => typeof m.content === 'string' ? m.content : m.content.map(b => b.text).join('\n');
  const msgs = opt.messages, last = msgs[msgs.length - 1], past = msgs.slice(0, -1);
  let s = opt.system;
  if (opt.schema) s += '\n\n# Format de réponse\nTa réponse est lue par un programme : réponds uniquement par un objet JSON valide, sans texte autour et sans bloc de code. Il contient exactement ces champs, dans cet ordre (une barre verticale sépare les valeurs permises, 0 désigne un nombre entier) :\n' + schemaHint(opt.schema);
  if (past.length) s += '\n\n# La partie jusqu\'ici (du plus ancien au plus récent)\n' + past.map(m => (m.role === 'user' ? '— JOUEUR —\n' : '— RÉCIT DÉJÀ RACONTÉ —\n') + txt(m)).join('\n\n');
  s += '\n\n# ' + (past.length ? 'Message actuel' : 'Demande') + '\n' + txt(last);
  if (opt.schema) s += '\n\nRéponds maintenant par l\'objet JSON seul.';
  return s;
}

    cancelled: ['Action annulée.', 'cancelled'],
    not_granted: ['Cette page n\'a pas reçu l\'autorisation d\'utiliser Claude. Recharge la page et accepte la demande pour jouer.', 'denied'],
    sampling_disabled: ['Claude n\'est pas disponible pour ce compte dans cette page.', 'denied'],
    not_declared: ['Cette page n\'est plus reliée à Claude.', 'denied'],

async function callSample(opt) {
  const input = sampleInput(opt);

    ? { model: ART_MODEL, modelTier: 'quick', effort: 'low', cache: false }
    : { model: MODEL, modelTier: 'default', effort: S.storyEffort, cache: false };
  if (opt.signal) options.signal = opt.signal;
  if (opt.onText) options.onText = u => { try { opt.onText(u.text); } catch (e) {} };
  const req = { tag: opt.tag, at: Date.now(), via: 'claude.use("sample")', model: options.model, effort: options.effort, input };
  if (opt.art) DEV.lastArt = req; else DEV.lastReq = req;
  let res;
  try { res = await SAMPLE(input, options); }
  catch (e) { const r = { tag: opt.tag, error: e && e.code, message: e && e.message }; if (opt.art) DEV.lastArt.res = r; else DEV.lastRes = r; throw mapSampleError(e); }

  const out = { tag: opt.tag, modelApplied: (res && res.modelApplied) || '(palier ' + (res && res.modelTierApplied) + ')', truncated: !!(res && res.truncated), text };

async function callClaude(opt) {
  if (HAS_HOST && !SAMPLE) await sampleReady;
  if (SAMPLE) return callSample(opt);   // une seule tentative : c'est le joueur qui relance
  if (!S.apiKey) throw new ApiError('Aucune clé API enregistrée.', 'nokey');
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { return await callApi(opt); }
    catch (e) {
      last = e;
      if (e.kind === 'fallback-unsupported' && S.useFallbacks) { S.useFallbacks = false; saveSettings(); attempt--; continue; }
      const retry = e.kind === 'network' || e.kind === 'overloaded' || e.kind === 'rate' || e.kind === 'server';
      if (!retry || attempt === 2) throw e;
      await sleep(1300 * (attempt + 1) * (attempt + 1));
    }
  }
  throw last;
}

// Complète une sauvegarde ancienne ou importée avec ce qui lui manque.
function migrate(g) {

    log: [], hist: [], summary: '', choices: [], notes: [], memo: '', ach: {}, dead: false, ended: false, diff: 'normal', lang: 'Français', slot: 0, usage: {} };
  for (const k in d) if (g[k] == null) g[k] = d[k];
  if (!g.stats || typeof g.stats.rolls !== 'number') g.stats = { rolls: 0, crit: 0, fumble: 0, ok: 0, dmg: 0 };
  if (typeof g.usage !== 'object' || g.usage.in != null) g.usage = {};
  if (!g.id) g.id = uid();
  if (!DIFFS[g.diff]) g.diff = 'normal';
  const w = WORLDS.find(x => x.id === (g.world && g.world.id)) || WORLDS[0];
  g.world = Object.assign({ id: w.id, name: w.name, pitch: w.pitch }, g.world || {});
  if (!g.world.terms) g.world.terms = Object.assign({}, w.terms);
  if (!g.world.art) g.world.art = w.art || 'fidèle à la description de ce monde';
  if (!g.start) g.start = { id: 'action', text: '' };
  const H = g.hero;
  H.id = 'hero';
  const legacy = { arcaniste: 'savant', charmeur: 'orateur' };
  if (!H.role) H.role = legacy[H.arch] || H.arch || 'combattant';
  const r = roleOf(H.role);
  if (!H.prof) H.prof = r ? r.prof.slice() : ['FOR', 'CON'];
  if (!H.skills) H.skills = r ? r.skills.slice() : [];
  if (!H.base) H.base = r ? { hp: r.hp, mana: r.mana, spells: r.spells } : { hp: 12, mana: 10, spells: 1 };
  if (!H.roleDesc) H.roleDesc = r ? r.desc : '';
  if (H.statPoints == null) H.statPoints = 0;
  if (H.skillPicks == null) H.skillPicks = 0;
  g.places = g.places.map(p => typeof p === 'string' ? { name: p, visits: 1, first: 0, last: 0 } : p);
  g.items.forEach(i => {
    if (!i.id) i.id = uid();
    if (!TYPES[i.type]) i.type = 'divers';
    if (!RARITY[i.rarity]) i.rarity = 'commun';
    if (i.eq && !TYPES[i.type].slot) i.eq = false;
  });
  for (const o of [H].concat(g.items, g.spells, g.npcs)) { if (!o.id) o.id = uid(); if (o.ss === 'pending') o.ss = ''; o.tries = 0; }
  H.id = 'hero';
  return g;
}

// ---------------------------------------------------------------- inventaire, pouvoirs, statuts
function findIn(list, name, key) {
  const n = norm(name);
  if (!n) return null;
  const k = key || 'name';
  let it = list.find(i => norm(i[k]) === n);
  if (it) return it;
  if (n.length < 3) return null;
  const c = list.filter(i => { const m = norm(i[k]); return m.length >= 3 && (m.includes(n) || n.includes(m)); });
  c.sort((a, b) => Math.abs(norm(a[k]).length - n.length) - Math.abs(norm(b[k]).length - n.length));
  return c[0] || null;
}
function addItem(a) {
  const name = cleanText(a && a.name, 60).replace(/[.\s]+$/, '');
  if (!name) return null;
  const qty = clamp(int(a.qty, 1) || 1, 1, 999);
  const ex = G.items.find(i => norm(i.name) === norm(name));
  if (ex) { ex.qty = clamp(ex.qty + qty, 1, 9999); ex.isNew = true; return { item: ex, qty, isNew: false }; }
  const type = TYPES[a.type] ? a.type : 'divers';
  const bonusStat = TYPES[type].slot && STATS.includes(a.bonus_stat) ? a.bonus_stat : 'AUCUN';
  const it = { id: uid(), name, desc: cleanText(a.description, 300), type, rarity: RARITY[a.rarity] ? a.rarity : 'commun', qty,
    bonusStat, bonusVal: bonusStat === 'AUCUN' ? 0 : clamp(int(a.bonus_value), 0, 5), value: clamp(int(a.value), 0, 9999999),
    eq: false, got: G.turn, isNew: true, sprite: null, ss: '' };
  if (it.bonusVal === 0) it.bonusStat = 'AUCUN';
  G.items.push(it);
  queueSprite('objet', it.id, 1);
  return { item: it, qty, isNew: true };
}
function removeItem(name, qty) {
  const it = findIn(G.items, name);
  if (!it) return null;
  let q = int(qty);
  if (q <= 0 || q > it.qty) q = it.qty;
  it.qty -= q;
  if (it.qty <= 0) G.items = G.items.filter(i => i !== it);
  return { item: it, qty: q };
}
function toggleEquip(it) {
  const slot = TYPES[it.type].slot;
  if (!slot) return;
  if (it.eq) { it.eq = false; note('Le héros retire : ' + it.name + '.'); }
  else {
    const same = G.items.filter(i => i.eq && TYPES[i.type].slot === slot);
    if (same.length >= SLOTS[slot].max) { same[0].eq = false; note('Le héros retire : ' + same[0].name + '.'); }
    it.eq = true; note('Le héros s\'équipe de : ' + it.name + '.');
  }
  Snd.tap(); autosave(); renderAll();
}
function addSpell(a) {
  const name = cleanText(a && a.name, 60);
  if (!name || G.spells.some(s => norm(s.name) === norm(name))) return null;
  const sp = { id: uid(), name, desc: cleanText(a.description, 300), cost: clamp(int(a.mana_cost, 2), 0, 40), sprite: null, ss: '' };
  G.spells.push(sp);
  queueSprite('sort', sp.id, 1);
  return sp;
}
function addStatus(s) {
  s = cleanText(s, 40);
  if (!s || G.statuses.some(x => norm(x) === norm(s))) return false;
  G.statuses.push(s); if (G.statuses.length > 12) G.statuses.shift();
  return true;
}
function removeStatus(s) {
  const n = norm(s); if (!n) return null;
  const i = G.statuses.findIndex(x => { const m = norm(x); return m === n || m.includes(n) || n.includes(m); });
  return i >= 0 ? G.statuses.splice(i, 1)[0] : null;
}

// ---------------------------------------------------------------- personnages, factions, adversaires, lieux
function upsertNpc(a, fromFoe) {
  const name = cleanText(a && a.name, 50);
  if (!name) return null;
  let n = findIn(G.npcs, name);
  const att = ATT[a.attitude] ? a.attitude : (fromFoe ? 'hostile' : 'neutre');
  if (!n) {
    n = { id: uid(), name, kind: a.kind === 'creature' ? 'creature' : (a.kind === 'personne' ? 'personne' : 'creature'), att, alive: a.alive !== false,
      desc: cleanText(a.description, 300), note: cleanText(a.note, 200), met: G.turn, seen: G.turn, sprite: null, ss: '' };
    G.npcs.push(n);
    if (G.npcs.length > 120) G.npcs.shift();
    queueSprite('pnj', n.id, fromFoe || att === 'hostile' ? 1 : 2);
    return { npc: n, isNew: true, changed: [] };
  }
  const changed = [];
  if (!fromFoe && ATT[a.attitude] && a.attitude !== n.att) { changed.push('att'); n.att = a.attitude; }
  if (!fromFoe && a.alive === false && n.alive) { changed.push('dead'); n.alive = false; }
  if (!fromFoe && a.alive === true && !n.alive) n.alive = true;
  if (a.description && !fromFoe) n.desc = cleanText(a.description, 300);
  if (a.note) n.note = cleanText(a.note, 200);
  n.seen = G.turn;
  return { npc: n, isNew: false, changed };
}
function changeFaction(a) {
  const name = cleanText(a && a.name, 50);
  if (!name) return null;
  let f = findIn(G.factions, name);
  if (!f) { f = { id: uid(), name, rep: 0, note: '' }; G.factions.push(f); }
  const ch = clamp(int(a.change), -40, 40);
  f.rep = clamp(f.rep + ch, -100, 100);
  if (a.note) f.note = cleanText(a.note, 200);
  return { f, ch };
}
function visit(loc) {
  const key = norm(loc);
  if (!key) return false;
  const prev = G.location ? G.places.find(x => norm(x.name) === norm(G.location)) : null;
  let p = G.places.find(x => norm(x.name) === key);
  if (prev && p === prev) { G.location = loc; return false; }
  if (!p) { p = { name: loc, visits: 0, first: G.turn, last: G.turn }; G.places.push(p); if (G.places.length > 60) G.places.shift(); }
  p.visits++; p.last = G.turn;
  if (prev) {
    const a = norm(prev.name);
    if (a !== key && !G.edges.some(e => (e[0] === a && e[1] === key) || (e[0] === key && e[1] === a))) G.edges.push([a, key]);
  }
  G.location = loc;
  return true;
}

// ---------------------------------------------------------------- succès
function unlock(id) {
  if (!G || G.ach[id]) return;
  const a = ACH.find(x => x.id === id);
  if (!a) return;
  G.ach[id] = G.turn || 1;
  pushLog({ t: 'ach', id });
  toast('Succès : ' + a.name, a.ic);
  Snd.ach();
}
function checkAch() {
  const H = G.hero, st = G.stats;
  if (G.turn >= 2) unlock('premier');
  if (st.crit >= 1) unlock('critique');
  if (st.crit >= 3) unlock('chance');
  if (st.fumble >= 1) unlock('fumble');
  if (st.rolls >= 50) unlock('joueur');
  if (!S.god && H.gold >= 500) unlock('riche');
  if (G.items.length >= 25) unlock('collection');
  if (G.items.some(i => i.rarity === 'legendaire')) unlock('relique');
  if (G.places.length >= 8) unlock('explorateur');
  if (G.spells.length >= 5) unlock('erudit');
  if (H.level >= 5) unlock('veteran');
  const done = G.quests.filter(q => q.status === 'done').length;
  if (done >= 1) unlock('quete');
  if (done >= 5) unlock('legende');
  if (G.npcs.some(n => n.att === 'allie' && n.alive)) unlock('allie');
  if (G.npcs.filter(n => n.att === 'hostile' && n.alive).length >= 3) unlock('ennemis');
}

// ---------------------------------------------------------------- prompts
function sysPrompt() {
  const H = G.hero, W = G.world, T = W.terms;
  return `Tu es le Maître du Jeu de « Vingt Faces », un jeu de rôle textuel en solo inspiré de Donjons & Dragons, où tout est possible. Le joueur écrit librement ce que son personnage tente ; tu arbitres avec équité, puis tu racontes. Un programme tient les comptes (points de vie, ${T.mana}, ${T.coin}, inventaire, personnages, carte) et lance les dés : toi, tu décides de ce qui se passe dans la fiction et tu le signales au programme par les champs de ta réponse JSON.

# Le monde
${W.name}. ${W.pitch}
Vocabulaire de ce monde : les pouvoirs s'appellent « ${T.magic} », leur énergie « ${T.mana} », la monnaie « ${T.coin} ». Respecte l'époque, les technologies et le ton de ce monde dans tout ce que tu inventes : objets, lieux, noms, pouvoirs. N'y glisse pas d'éléments d'un autre genre sans raison.

# Le héros
${H.name}, ${H.archName} (${H.roleDesc}).${H.concept ? ' Concept : ' + H.concept : ''}
Caractéristiques fortes : ${H.prof.map(s => STAT_NAMES[s]).join(' et ')}. Compétences maîtrisées : ${H.skills.map(s => SKILL[s] ? SKILL[s].name : s).join(', ') || 'aucune'}.

# Langue
Tout ce que lit le joueur (narrative, reason, choices, noms et descriptions, statuts, quêtes, personnages, factions, lieux) est écrit en : ${G.lang}. Les valeurs d'énumération du schéma restent telles quelles.

# Déroulement d'un tour
Chaque message du joueur contient :
- [ÉTAT] : la vérité chiffrée du jeu, à jour. Fie-toi à elle plutôt qu'à ta mémoire pour l'inventaire, les PV, l'énergie, l'argent, les pouvoirs et les adversaires.
- [ACTION] : ce que le joueur tente, en texte libre.
- parfois [JET] : le résultat d'un dé que le programme vient de lancer pour cette action.
- parfois [NOTES] : des événements survenus hors récit (équipement changé, niveau gagné…) à intégrer naturellement.

Tu réponds de l'une de ces deux façons :
1. Demander un jet (needs_roll = true) quand l'issue est incertaine et que réussir ou échouer change vraiment la suite : combat, acrobatie, discrétion, persuasion risquée, pouvoir, effort physique, ramasser quelque chose de lourd, fixé, gardé ou dangereux… Remplis « roll », écris dans « narrative » une ou deux phrases de mise en tension qui s'arrêtent juste avant l'issue, et laisse tout le reste neutre (0, listes vides, rest « aucun », ending « aucune », location et time_of_day inchangés).
2. Raconter directement (needs_roll = false, roll = null) quand l'action est banale, sans risque, ou relève de la simple conversation ou de l'observation.

Quand [JET] est présent, le dé est déjà lancé : needs_roll = false, roll = null, et tu racontes l'issue en respectant strictement le verdict.
- RÉUSSITE CRITIQUE : succès éclatant, avec un bonus inattendu.
- RÉUSSITE : l'action réussit comme voulu.
- ÉCHEC DE PEU : c'est raté, mais avec un petit quelque chose (progrès partiel, ou réussite avec un coût).
- ÉCHEC : l'action rate et la situation se complique.
- ÉCHEC CRITIQUE : désastre mémorable, parfois drôle, toujours avec des conséquences.
Un seul jet par action : ne demande jamais un second jet pour la même action, et n'invente jamais toi-même un résultat de dé.

# Tout est possible
Ne dis jamais qu'une action est impossible ou interdite par le jeu. Si le joueur tente quelque chose d'absurde, de génial ou de suicidaire, fixe une difficulté honnête et laisse le dé et les conséquences parler. Il peut aller n'importe où, parler à n'importe qui, ramasser n'importe quoi, changer de but en cours de route : invente lieux, personnages et objets au besoin, en restant cohérent avec ce qui est établi. Le monde réagit, se souvient, et ses conséquences persistent. Les « choices » ne sont que des suggestions, jamais des rails.

# Régler un jet
stat : la caractéristique qui correspond à la façon dont le joueur s'y prend (FOR ${STAT_HINT.FOR} · DEX ${STAT_HINT.DEX} · CON ${STAT_HINT.CON} · INT ${STAT_HINT.INT} · SAG ${STAT_HINT.SAG} · CHA ${STAT_HINT.CHA}).
skill : la compétence la plus proche, ou « aucune ». Liste : ${SKILLS.map(s => s.id + ' (' + s.name + ', ' + s.stat + ')').join(', ')}. Le programme ajoute le bonus de maîtrise si le héros maîtrise cette compétence.
dc : 5 très facile · 8 facile · 11 moyen · 14 corsé · 17 difficile · 20 très difficile · 24 héroïque · 28 légendaire · 32 quasi impossible. Le programme ajoute lui-même au d20 les modificateurs, la maîtrise et l'équipement, puis ajuste selon le mode de difficulté : n'en tiens pas compte dans dc. Un 20 naturel réussit toujours, un 1 naturel échoue toujours.
advantage : « avantage » si l'approche est maligne, bien préparée ou servie par le bon outil ; « desavantage » si les circonstances sont franchement contraires (blessure, statut gênant, terrain hostile) ; sinon « normal ».
reason : une courte phrase qui dit au joueur ce qui est en jeu.

# ${T.magic}
Les pouvoirs (${T.magic}) existent pour tous, mais ils coûtent et ont des limites.
- mana_cost (dans roll) : effet minuscule 1 · mineur 2-3 · modéré 4-6 · puissant 7-10 · majeur 12 et plus. Le programme prélève cette énergie (${T.mana}) au moment du jet, que le pouvoir réussisse ou non. Indique toujours le vrai coût, même s'il dépasse l'énergie du héros : le programme lui proposera alors de payer la différence en points de vie (surcharge).
- Un pouvoir connu (liste « pouvoirs_connus » de [ÉTAT]) coûte son prix indiqué et se lance à difficulté normale. Un pouvoir improvisé coûte 2 de plus et se lance avec un dc augmenté de 3.
- La puissance accessible suit le niveau du héros : au niveau 1, rien de cataclysmique sans un dc de 24 ou plus et un coût majeur.
- Presque tout vrai pouvoir demande un jet. Un échec critique déclenche un contrecoup imprévisible.
- L'énergie ne revient pas toute seule : seulement par le repos, des consommables ou des lieux de pouvoir. N'utilise mana_change que pour ces gains, ou pour un coût qui n'est pas passé par un jet.
- Le héros apprend un pouvoir (spells_add) quand la fiction le justifie : maître, livre, implant, révélation, ou pouvoir improvisé réussi de façon critique. Ses noms et effets appartiennent à ce monde.

# Inventaire
Tout ce que le héros ramasse, achète, reçoit, vole ou fabrique entre dans items_add — une arme comme un caillou, une chaise, une dent de monstre ou un souvenir. Si l'objet est lourd, fixé, gardé ou dangereux, c'est un jet.
- name : court (1 à 4 mots), sans article ; réutilise exactement le nom déjà présent dans [ÉTAT] pour un objet déjà possédé.
- description : une phrase concrète et visuelle (forme, matière, couleurs, technologie) propre à ce monde — elle sert aussi à dessiner l'icône de l'objet.
- type : arme, bouclier, armure (ou tenue), casque (toute coiffe), accessoire (bijou, implant, amulette…), consommable, nourriture, document (lettre, carte, livre, données…), outil, cle (objet clé de l'intrigue), tresor, materiau, creature (animal, familier, drone…), divers.
- rarity : commun pour l'ordinaire ; peu_commun, rare, epique ou legendaire pour ce qui est de plus en plus exceptionnel. Garde legendaire pour les reliques uniques.
- bonus_stat / bonus_value : seulement pour le vrai équipement (arme, bouclier, armure, casque, accessoire), de +1 (peu commun) à +3 (épique ou légendaire) ; sinon « AUCUN » et 0.
- value : valeur marchande en ${T.coin}.
Ce qui est consommé, donné, vendu, perdu ou brisé sort par items_remove, avec le nom exact figurant dans [ÉTAT]. L'argent passe uniquement par gold_change, jamais par un objet. Si le joueur veut utiliser un objet qu'il n'a pas, la fiction le lui fait sentir.

# Personnages, factions, adversaires
- npcs : ajoute chaque personnage ou créature notable la première fois qu'il apparaît (name, kind, attitude envers le héros, alive, description physique concrète d'une phrase qui servira à dessiner son portrait, note sur son rôle). Remets-le ensuite seulement quand son attitude change, qu'il meurt, ou qu'on apprend quelque chose d'important (même name). Sinon, liste vide.
- factions : quand une action du héros touche un groupe organisé (guilde, gang, corporation, clan, temple, ville…), indique son nom et le changement de réputation, de -30 à +30, avec une courte note. Sinon, liste vide.
- foes : la liste COMPLÈTE des adversaires actuellement engagés contre le héros, avec leurs points de vie (hp, hp_max) que tu tiens à jour d'un tour à l'autre à partir de [ÉTAT]. Repères : sbire 4-8, adversaire sérieux 12-25, boss 30-80. Retire ceux qui sont vaincus ou en fuite ; liste vide hors combat. Ajoute aussi chaque nouvel adversaire nommé dans npcs avec l'attitude « hostile ».

# Santé, progression, repos
- hp_change : négatif pour une blessure, positif pour un soin. Repères pour un héros débutant (10 à 20 PV) : égratignure 1-2, coup sérieux 3-6, blessure grave 7-10. Le programme gère la mort : si les PV tombent à 0, il offre un jet de la dernière chance.
- xp_gain : 5-15 pour une réussite notable, 20-40 pour un obstacle surmonté, 50-100 pour un grand accomplissement. Rien pour les actions banales.
- gold_change : repères — repas 1, nuit au calme 3, arme simple 15-30, objet rare 100 et plus (adapte à la monnaie du monde).
- rest : « court » (une pause d'une heure à l'abri : le programme rend un peu de PV et d'énergie) ou « long » (une vraie nuit en sécurité : tout est restauré). Ne double pas ce soin dans hp_change.
- statuses_add / statuses_remove : états durables en un ou deux mots (Empoisonné, Béni, Recherché…).
- quests : crée une entrée quand un objectif apparaît, puis mets-la à jour (même title) quand elle avance, se termine ou échoue.
- location et time_of_day : toujours renseignés avec le lieu précis et le moment actuels (quelques mots ; garde exactement le même nom de lieu tant que le héros n'en change pas).
- mood : l'ambiance de la scène.
- choices : 3 ou 4 pistes brèves (8 mots au plus), variées, dont une audacieuse ou inattendue. Vide quand tu demandes un jet.
- ending : « mort » seulement si la fiction rend la mort certaine et définitive ; « fin » si l'histoire atteint une vraie conclusion ; sinon « aucune ».

# Style
Deuxième personne du singulier, au présent. Une prose vive, sensorielle et claire ; des personnages qui ont une voix, des envies et des répliques entre guillemets « ». En général 70 à 150 mots, davantage pour les grands moments, en paragraphes courts. Pas de listes, pas de chiffres ni de mécanique dans le récit (le programme les affiche). Termine sur une ouverture qui donne envie d'agir, sans demander systématiquement « Que fais-tu ? ». Mise en forme : seulement *italique* et **gras**, avec parcimonie. Registre tout public averti : tension, danger et humour noir bienvenus, pas de contenu sexuel explicite.`;
}

function artSystem() {
  const W = G.world;
  return `Tu es l'artiste pixel art d'un jeu de rôle. On te donne une liste de sujets numérotés ; pour chacun, tu dessines une icône originale de 16×16 pixels, pensée pour ce sujet précis.

# Direction artistique de ce monde
${W.name}. ${W.pitch}
Style visuel : ${W.art}.
Chaque icône doit appartenir clairement à cet univers : matières, technologies, époque et couleurs de ce monde. N'emprunte pas d'éléments médiévaux (épées, parchemins, blasons, armures de plates…) si le monde ne l'est pas, sauf si le sujet le décrit explicitement. Suis la description du sujet avant tout.

# Format
Réponds par un objet JSON : {"sprites":[{"id":"1","palette":[{"key":"a","hex":"#rrggbb"}],"rows":["…16 caractères…", … 16 lignes]}]}, un élément par sujet, dans l'ordre, avec l'id du sujet.
- palette : 4 à 10 couleurs ; key = une lettre minuscule ; hex = #RRGGBB.

# Pour une icône belle et lisible en tout petit

const ART = { q: [], active: 0, ctls: new Set(), running: new Set(), pausedUntil: 0, timer: 0 };

  if (kind === 'sort') return G.spells.find(s => s.id === id) || null;

}
function fallbackIc(kind, o) {

  if (kind === 'sort') return 'spark';

}
function spriteEl(kind, o, size) {

  if (o && o.sprite) return el('img', { class: 'px', src: pixURL(o.sprite.r, o.sprite.p), style: st, alt: '', 'data-sp': ref, 'data-sz': size });
  if (o && o.ss !== 'fail') return el('div', { class: 'spr-pend', style: st, 'data-sp': ref, 'data-sz': size, title: 'Dessin en cours…' }, ic(fallbackIc(kind, o), size));
  return el('img', { class: 'px', src: icURL(fallbackIc(kind, o)), style: st + ';opacity:.85', alt: '', title: 'Dessin indisponible : touche « Redessiner »', 'data-sp': ref, 'data-sz': size });

  while (ART.active < max && ART.q.length) {
    ART.q.sort((a, b) => a.prio - b.prio);
    const batch = ART.q.splice(0, 1);

// Le joueur agit : on interrompt le dessin en cours (il reprendra après le tour) pour libérer la place du récit.
// On attend (au plus 1,5 s) que le dessin interrompu ait rendu sa place avant d'envoyer le tour.
function yieldArtToStory() {
  if (!SAMPLE || !ART.running.size) return Promise.resolve();

}
const artPending = () => ART.q.length + ART.active;
function subjectLine(kind, o, n) {
  const T = G.world.terms;

  if (kind === 'objet') return n + '. Objet d\'inventaire — « ' + o.name + ' » (' + TYPES[o.type].one.toLowerCase() + ', ' + RARITY[o.rarity].label.toLowerCase() + ') : ' + (o.desc || 'pas de description');
  if (kind === 'sort') return n + '. Icône de pouvoir (' + T.magic + ') — « ' + o.name + ' » : ' + (o.desc || '');
  return n + '. Portrait ' + (o.kind === 'creature' ? 'de créature' : 'de personnage') + ' — « ' + o.name + ' » (' + ATT[o.att].label.toLowerCase() + ') : ' + (o.desc || o.note || '');

async function drawBatch(batch) {

  if (!subs.length) return;

  const apply = obj => {

    const cur = G && G.id === gid ? spriteTarget(s.j.kind, s.j.id) : null;
    if (!cur || cur.sprite) continue;
    // Interrompu pour laisser passer le récit, ou limite d'usage : ce n'est pas un échec du dessin.

let turnCtl = null;
async function requestTurn(p) {
  const ctl = turnCtl = new AbortController();

  let live = null;
  try {
    const res = await callClaude({
      system: sysPrompt(), messages: buildMessages(p), schema: TURN_SCHEMA, maxTokens: 24000, tag: p.intro ? 'intro' : (p.roll ? 'issue' : 'tour'), signal: ctl.signal,
      onText: full => {
        const t = partialField(full, 'narrative');
        if (!t) return;
        showThinking(false);
        if (!live) live = liveNarr();
        live.set(t);
      }
    });
    return res.data;
  } finally { if (turnCtl === ctl) turnCtl = null; showThinking(false); if (live) live.remove(); }
}
async function resolveTurn(p) {
  let o = await requestTurn(p);
  if (o.needs_roll && o.roll && !p.roll && !p.intro) {
    const setup = cleanText(o.narrative, 700);
    if (setup) pushLog({ t: 'narr', text: setup, setup: true });
    p.setup = setup;
    const base = clamp(int(o.roll.dc, 11), 2, 40);
    const spec = {
      stat: STATS.includes(o.roll.stat) ? o.roll.stat : 'DEX', skill: SKILL[o.roll.skill] ? o.roll.skill : '',
      baseDc: base, dc: clamp(base + DIFFS[G.diff].dc, 2, 40),
      reason: cleanText(o.roll.reason, 220), mana: clamp(int(o.roll.mana_cost), 0, 60),
      adv: ['avantage', 'desavantage'].includes(o.roll.advantage) ? o.roll.advantage : 'normal'

    const r = await Dice.ask(spec);
    if (!r) return 'cancel';
    p.roll = r;
    pushLog(Object.assign({ t: 'roll' }, r));
    o = await requestTurn(p);
  }

}

  } else if (o.rest === 'court') {

    chips.push({ k: 'heal', text: 'Repos court' }); fx.push('repos court');
  }
  let dhp = int(o.hp_change);
  if (dhp < 0) dhp = Math.min(-1, Math.round(dhp * DIFFS[G.diff].dmg));
  if (dhp) {
    const before = H.hp;
    H.hp = clamp(H.hp + dhp, S.god ? 1 : 0, H.hpMax);
    const real = H.hp - before;
    if (real) { chips.push({ k: real < 0 ? 'dmg' : 'heal', ic: 'heart', text: (real > 0 ? '+' : '−') + Math.abs(real) + ' PV' }); fx.push('PV ' + fmtModA(real)); hudPulse(real < 0 ? 'dmg' : 'heal'); if (real < 0) G.stats.dmg += -real; }
  }
  let dm = int(o.mana_change);
  if (S.god && dm < 0) dm = 0;
  if (dm) {
    const before = H.mana; H.mana = clamp(H.mana + dm, 0, H.manaMax);
    const real = H.mana - before;
    if (real) { chips.push({ k: 'mana', ic: 'drop', text: (real > 0 ? '+' : '−') + Math.abs(real) + ' ' + T.mana }); fx.push(T.mana + ' ' + fmtModA(real)); }
  }
  let dg = int(o.gold_change);
  if (S.god && dg < 0) dg = 0;
  if (dg) {
    const before = H.gold; H.gold = clamp(H.gold + dg, 0, 999999999);
    const real = H.gold - before;
    if (real) { chips.push({ k: 'gold', ic: 'coin', text: (real > 0 ? '+' : '−') + Math.abs(real) + ' ' + T.coin }); fx.push(T.coin + ' ' + fmtModA(real)); }
  }
  for (const r of arr(o.items_remove, 12)) {
